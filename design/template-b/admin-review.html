<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Admin · Testimonies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=League+Spartan:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FCFAF4}
a{color:#0B1830}a:hover{color:#0B1830}
.app{--ground:#FCFAF4;--surface:#FFFFFF;--line:#ECE6D8;--ink:#0B1830;--muted:#5A6375;--g50:#FDF7E9;--g100:#FAEBC7;--g500:#E6A82A;--g800:#6B4A07;--ok:#1F6A50;--okt:#E3F1EC;--bad:#8E2F23;--badt:#FBE7E4;font-family:'DM Sans',Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--ground);display:flex;flex-wrap:wrap;min-height:100vh}
.app *{box-sizing:border-box}
.app a:focus-visible,.app button:focus-visible,.app textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.side{flex:0 0 240px;padding:20px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;text-decoration:none;color:var(--ink)}
.brand i{width:18px;height:23px;border-radius:9px 9px 0 0;background:var(--g500);display:block}
.brand b{font-family:'League Spartan',sans-serif;font-size:20px;letter-spacing:-.04em;line-height:1}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.grp{font-size:12.5px;color:var(--muted);padding:22px 10px 8px}
.ni{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.ni:hover{background:#F3EEE2}
.ni svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
.ni.on{background:var(--g100);color:var(--g800);font-weight:600}
.ni.on svg{color:var(--g500)}
.ni em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--g800);background:var(--g100);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.ni.on em{background:var(--surface)}
.grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;margin-top:12px}
.me b{width:30px;height:30px;border-radius:50%;background:#E6EEF8;color:#1D4E89;display:flex;align-items:center;justify-content:center;font-size:13px}
.me span{font-size:13px;color:var(--muted)}
.me strong{display:block;color:var(--ink);font-weight:600}
.main{flex:999 1 640px;min-width:0;padding:32px 36px 48px}
.title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:24px}
.title h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.title p{margin:6px 0 0;font-size:15px;color:var(--muted)}
.sec2{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:#ECE7DC;color:var(--ink);font-weight:600;text-decoration:none}
.counts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:24px}
.cc{height:61px;padding:10px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.cc span{font-size:13px;color:var(--muted)}
.cc b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cc:hover{border-color:#D9CFB8}
.cc.on{border-color:var(--g500);background:var(--g50)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.lh h2{font-size:15px;font-weight:600;margin:0}
.lh span{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;width:100%;text-align:left;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font:inherit;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover{background:#FBF8F0}
.row.on{background:var(--g50);box-shadow:inset 3px 0 0 var(--g500)}
.row strong{font-weight:600;font-size:15px}
.row .m{grid-column:1/2;font-size:13px;color:var(--muted)}
.row .x{grid-column:1/3;font-size:14px;color:#3A4352;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.age{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;position:sticky;top:24px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-wait{background:var(--g100);color:var(--g800)}
.p-pub{background:var(--okt);color:var(--ok)}
.p-chg{background:#E6EEF8;color:#1D4E89}
.p-dec{background:var(--badt);color:var(--bad)}
.detail h3{font-size:18px;font-weight:600;margin:12px 0 4px;letter-spacing:-.01em}
.detail .m{font-size:13px;color:var(--muted);margin:0 0 14px}
.body{font-size:15px;line-height:1.6;margin:0 0 16px;color:#1E2738}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.note textarea{width:100%;min-height:72px;border:1px solid #E3DCCB;border-radius:10px;padding:10px 12px;font:inherit;resize:vertical;background:#FFFEFB}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.b1{min-height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.b1:hover{background:#22355A}
.b2{min-height:40px;padding:0 14px;border:1px solid #E3DCCB;border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.b2:hover{background:#F6F2E8}
.b3{min-height:40px;padding:0 14px;border:1px solid #F0D5D0;border-radius:10px;background:var(--surface);color:var(--bad);font:inherit;font-weight:600;cursor:pointer}
.done{margin:14px 0 0;font-size:13px;color:var(--muted)}
.topbar{display:none}
@media (max-width: 900px){
.side{display:none}
.topbar{display:flex;flex:1 0 100%;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-bottom:1px solid var(--line)}
.main{padding:20px 16px 40px}
.counts{display:flex;overflow-x:auto}
.cc{flex:0 0 150px}
.work{grid-template-columns:minmax(0,1fr)}
.work>*{min-width:0}
.detail{position:static}
}
@media (max-width: 900px){.side.open{display:flex;position:fixed;inset:48px 0 0 0;z-index:30;background:var(--ground);overflow:auto;border-right:0;padding-bottom:40px}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="app">
<div class="topbar"><strong>Testimonies</strong><button type="button" class="b2" aria-expanded="{{navExpanded}}" aria-controls="admin-nav" onClick="{{toggleNav}}">{{navLabel}}</button></div>
<nav class="side {{navCls}}" id="admin-nav" aria-label="Admin">
<a class="brand" href="index.html"><i aria-hidden="true"></i><span><b>[church name]</b><span>Admin</span></span></a>
<a class="ni" href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Overview</a>
<div class="grp">Needs attention</div>
<a class="ni" href="admin-visitors.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>New visitors<em>2</em></a>
<a class="ni" href="admin-prayer.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Prayer requests<em>5</em></a>
<a class="ni on" href="admin-review.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 5h14v11H9l-4 3z"></path></svg>Testimonies<em>{{waiting}}</em></a>
<a class="ni" href="admin-chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h12v9H8l-4 3zM16 9h4v9l-3-2h-6v-2"></path></svg>Bible study chat<em>4</em></a>
<a class="ni" href="admin-registrations.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"></rect><path d="M9 9h6M9 13h6"></path></svg>Registrations</a>
<div class="grp">Every week</div>
<a class="ni" href="admin-gatherings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Gatherings &amp; Zoom</a>
<a class="ni" href="admin-live.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M10 9.5l4 2.5-4 2.5z"></path></svg>Live stream</a>
<a class="ni" href="admin-announcement.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10v4h4l6 4V6l-6 4z"></path></svg>Announcement bar</a>
<a class="ni" href="admin-reminders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg>Reminders</a>
<div class="grp">Content</div>
<a class="ni" href="admin-events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16"></path></svg>Events &amp; banners</a>
<a class="ni" href="admin-sermons.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2-2h12v16H7a2 2 0 0 0-2 2z"></path></svg>Sermons &amp; studies</a>
<a class="ni" href="admin-message.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"></path></svg>Today's Message</a>
<a class="ni" href="admin-social.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3h16v-3"></path></svg>Post to social</a>
<div class="grp">Giving</div>
<a class="ni" href="admin-offerings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Offerings</a>
<div class="grow"></div>
<a class="ni" href="admin-users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M17 20h4a5 5 0 0 0-5-5"></path></svg>Users &amp; roles</a>
<a class="ni" href="admin-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>Settings</a>
<div class="me"><b aria-hidden="true">YN</b><span><strong>[Your name]</strong>Admin</span></div>
</nav>

<main class="main">
<div class="title">
<div><h1>Testimonies</h1><p>{{finding}}</p></div>
<a class="sec2" href="index.html">View on the website</a>
</div>
<div class="counts" role="group" aria-label="Filter by status">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" class="cc {{t.cls}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}"><span>{{t.label}}</span><b>{{t.count}}</b></button>
</sc-for>
</div>
<div class="work">
<section class="list" aria-labelledby="h-list">
<div class="lh"><h2 id="h-list">{{listTitle}}</h2><span>Oldest first</span></div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
<button type="button" class="row {{r.cls}}" onClick="{{r.pick}}"><strong>{{r.title}}</strong><span class="age">{{r.age}}</span><span class="m">{{r.meta}}</span><span class="x">{{r.body}}</span></button>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div class="empty">Nothing here right now.</div></sc-if>
</section>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
<aside class="detail" aria-labelledby="h-detail">
<span class="pill {{sel.pillCls}}">{{sel.statusLabel}}</span>
<h3 id="h-detail">{{sel.title}}</h3>
<p class="m">{{sel.meta}}</p>
<p class="body">{{sel.body}}</p>
<dl class="kv"><dt>Shown as</dt><dd>{{sel.shownAs}}</dd><dt>Email</dt><dd>{{sel.email}}</dd><dt>Consent</dt><dd>Agreed to publish after review</dd></dl>
<sc-if value="{{sel.waiting}}" hint-placeholder-val="{{ true }}">
<div class="note"><label for="note">Note to the person (sent if you ask for changes or decline)</label><textarea id="note"></textarea></div>
<div class="acts"><button type="button" class="b1" onClick="{{approve}}">Approve and publish</button><button type="button" class="b2">Edit text</button><button type="button" class="b2" onClick="{{askChanges}}">Ask for changes</button><button type="button" class="b3" onClick="{{decline}}">Decline</button></div>
</sc-if>
<sc-if value="{{sel.notWaiting}}" hint-placeholder-val="{{ false }}">
<p class="done">{{sel.doneNote}}</p>
</sc-if>
</aside>
</sc-if>
</div>
</main>
</div>
</template>
<noscript><p style="padding:24px;font-family:system-ui,sans-serif">Please turn on JavaScript to view this page.</p></noscript>

<script>
class Component extends PageLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: 'waiting',
      sel: 't1',
      items: [
        { id: 't1', title: 'Healed after surgery', name: 'Grace A.', shownAs: 'First name only (Grace A.)', email: 'g•••@gmail.com', who: 'Member', cat: 'Healing', date: 'Oct 14', age: '7 days', body: 'Sample text: a short account of recovery after an operation in September, and thanks to the prayer team who visited and prayed every Friday.', status: 'waiting' },
        { id: 't2', title: 'A job after eight months', name: 'Daniel O.', shownAs: 'Full name', email: 'd•••@yahoo.com', who: 'Visitor', cat: 'Provision', date: 'Oct 18', age: '3 days', body: 'Sample text: a visitor who joined the Friday prayer meeting on Zoom describes finding work after a long search.', status: 'waiting' },
        { id: 't3', title: 'Our son came home', name: 'Anonymous', shownAs: 'Anonymous', email: 'r•••@outlook.com', who: 'Member', cat: 'Answered prayer', date: 'Oct 20', age: '1 day', body: 'Sample text: a family thanks the church for praying while their son was away, and shares how he came back.', status: 'waiting' },
        { id: 't4', title: 'Peace in a hard season', name: 'Esther K.', shownAs: 'First name only (Esther K.)', email: 'e•••@gmail.com', who: 'Member', cat: 'Healing', date: 'Oct 2', age: 'Published Oct 5', body: 'Sample text: an already-published testimony, shown on the website.', status: 'published' },
        { id: 't5', title: 'Thank you for the meals', name: 'Joseph T.', shownAs: 'Full name', email: 'j•••@gmail.com', who: 'Member', cat: 'Something else', date: 'Oct 11', age: 'Asked Oct 12', body: 'Sample text: a testimony sent back to its author with a request to remove a third person’s name.', status: 'changes' }
      ]
    };
  }
  setStatus(status) {
    const id = this.state.sel;
    const items = this.state.items.map((x) => (x.id === id ? { ...x, status, age: status === 'published' ? 'Published today' : status === 'changes' ? 'Asked today' : 'Declined today' } : x));
    const next = items.find((x) => x.status === this.state.tab);
    this.setState({ items, sel: next ? next.id : null });
  }
  pageVals() {
    const items = this.state.items;
    const n = (s) => items.filter((x) => x.status === s).length;
    const defs = [['waiting', 'Waiting for review'], ['published', 'Published'], ['changes', 'Changes asked'], ['declined', 'Declined']];
    const tabs = defs.map(([id, label]) => ({
      label, count: n(id), cls: this.state.tab === id ? 'on' : '', pressed: this.state.tab === id ? 'true' : 'false',
      pick: () => { const first = items.find((x) => x.status === id); this.setState({ tab: id, sel: first ? first.id : null }); }
    }));
    const pill = { waiting: ['p-wait', 'Waiting for review'], published: ['p-pub', 'Published'], changes: ['p-chg', 'Changes asked'], declined: ['p-dec', 'Declined'] };
    const rows = items.filter((x) => x.status === this.state.tab).map((x) => ({
      ...x,
      meta: x.name + ' · ' + x.who + ' · ' + x.cat + ' · sent ' + x.date,
      cls: x.id === this.state.sel ? 'on' : '',
      pick: () => this.setState({ sel: x.id })
    }));
    const s = items.find((x) => x.id === this.state.sel && x.status === this.state.tab);
    const sel = s ? {
      ...s,
      meta: s.name + ' · ' + s.who + ' · ' + s.cat + ' · sent ' + s.date,
      pillCls: pill[s.status][0],
      statusLabel: pill[s.status][0] === 'p-wait' ? 'Waiting ' + s.age : pill[s.status][1],
      waiting: s.status === 'waiting',
      notWaiting: s.status !== 'waiting',
      doneNote: s.status === 'published' ? 'Live on the Testimonies page. The author was emailed.' : s.status === 'changes' ? 'The author was emailed your note and can send an updated version.' : 'Declined. It will never be shown on the website.'
    } : null;
    const w = n('waiting');
    const oldest = items.filter((x) => x.status === 'waiting')[0];
    return {
      tabs, rows, sel, hasSel: Boolean(sel), empty: rows.length === 0,
      waiting: w,
      listTitle: defs.find((d) => d[0] === this.state.tab)[1],
      finding: w === 0 ? 'Nothing is waiting. Every testimony has been reviewed.' : w + (w === 1 ? ' testimony is' : ' testimonies are') + ' waiting for review; the oldest was sent ' + (oldest ? oldest.age + ' ago.' : ''),
      approve: () => this.setStatus('published'),
      askChanges: () => this.setStatus('changes'),
      decline: () => this.setStatus('declined')
    };
  }
  renderVals() {
    const open = !!this.state.navOpen;
    return Object.assign({}, this.pageVals(), {
      navCls: open ? 'open' : '',
      navExpanded: open ? 'true' : 'false',
      navLabel: open ? 'Close' : 'Menu',
      toggleNav: () => this.setState({ navOpen: !this.state.navOpen })
    });
  }
}
window.__boot(Component, {});
</script>

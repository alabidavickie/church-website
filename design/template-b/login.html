<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B1830}
a{color:#0B1830}a:hover{color:#0B1830}
.pg{--ground:#FAF8F3;--ink:#0B1830;--gold:#E6A82A;--onnavy:#F4F1EA;--onnavy2:#B9C4D6;--m:clamp(16px,4vw,56px);font-family:Figtree,system-ui,sans-serif;font-size:18px;line-height:1.5;color:var(--onnavy);background:var(--ink);min-height:100vh;display:flex;flex-direction:column;overflow-x:clip}
.pg *{box-sizing:border-box}
.pg{color-scheme:only light}
.pg a:focus-visible,.pg button:focus-visible,.pg input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:88px;padding:0 var(--m)}
.wm{display:flex;align-items:center;gap:12px;font-family:'League Spartan',Figtree,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.04em;color:var(--onnavy);text-decoration:none}
.wm i{width:22px;height:28px;border-radius:11px 11px 0 0;background:var(--gold);display:block}
.back{color:var(--onnavy);font-weight:700;text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:6px}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-end;padding:24px var(--m) 0}
.arch{width:min(100%,600px);background:var(--gold);color:var(--ink);border-radius:300px 300px 0 0;padding:clamp(150px,18vw,220px) clamp(28px,5vw,64px) 56px;animation:archin 1s cubic-bezier(.2,.7,.1,1) both}
.arch h1{font-family:'League Spartan',Figtree,sans-serif;font-weight:700;letter-spacing:-.04em;line-height:.9;font-size:clamp(48px,5vw,72px);margin:0 0 12px;text-align:center}
.arch .sub{text-align:center;margin:0 0 32px}
form{display:flex;flex-direction:column;gap:14px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-size:16px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row a{font-size:15px;font-weight:700}
.in{height:56px;border:0;background:#F6E2B4;color:var(--ink);font:inherit;padding:0 16px;border-radius:0}
.ts{display:flex;align-items:center;gap:12px;height:64px;padding:0 16px;background:#F6E2B4;font-size:14px}
.ts b{width:24px;height:24px;border:2px solid var(--ink);display:block;flex-shrink:0}
.ts span{flex:1}
.go{display:flex;align-items:center;justify-content:center;min-height:60px;background:var(--ink);color:var(--ground);font-weight:700;text-decoration:none;transition:background-color .16s,color .16s}
.go:hover{background:var(--ground);color:var(--ink)}
.alt{margin:22px 0 0;text-align:center;font-size:16px}
.alt a{font-weight:700}
.mfa{margin:0;padding:20px var(--m) 28px;text-align:center;color:var(--onnavy2);font-size:15px}
@keyframes archin{from{transform:translateY(12%);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.pg *{animation:none!important;transition:none!important}}
@media (max-width: 640px){.arch{border-radius:50vw 50vw 0 0;padding:34vw 22px 40px}}
.ck{position:fixed;left:16px;bottom:16px;z-index:60;width:min(560px,calc(100vw - 32px));max-height:calc(100svh - 32px);overflow:auto;background:var(--ink,#0B1830);color:var(--onnavy,#F4F1EA);border-radius:28px 28px 0 0;box-shadow:0 0 0 1px rgba(244,241,234,.22),0 22px 60px rgba(0,0,0,.45);padding:28px 28px 24px;font-size:16px;line-height:1.5;text-align:left;--focus:#E6A82A}
.ck h2{font-family:'League Spartan',Figtree,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1;font-size:30px;margin:0 0 10px;color:var(--gold,#E6A82A)}
.ck p{margin:0 0 18px;color:var(--onnavy2,#B9C4D6)}
.ck a{color:var(--onnavy,#F4F1EA);text-decoration:underline;text-underline-offset:3px}
.ckb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ckbtn{flex:1 1 130px;min-height:50px;padding:0 14px;white-space:nowrap;border:0;border-radius:999px 999px 0 0;font:inherit;font-weight:700;cursor:pointer;transition:background-color .16s,color .16s}
.ckbtn.yes{background:var(--gold,#E6A82A);color:var(--ink,#0B1830)}
.ckbtn.no{background:var(--onnavy,#F4F1EA);color:var(--ink,#0B1830)}
.ckbtn.yes:hover{background:#F2BE52}
.ckbtn.no:hover{background:#FFFFFF}
.cktl{background:none;border:0;padding:14px 0 0;font:inherit;font-weight:600;color:var(--onnavy,#F4F1EA);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.ckl{list-style:none;margin:0 0 18px;padding:0}
.ckl li{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(244,241,234,.16)}
.ckl strong{display:block;color:var(--onnavy,#F4F1EA)}
.ckl span{display:block;font-size:14px;color:var(--onnavy2,#B9C4D6)}
.sw{flex-shrink:0;width:52px;height:30px;margin-top:2px;border-radius:999px;border:0;background:#3A4A66;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#F4F1EA;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--gold,#E6A82A)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--ink,#0B1830)}
.sw:disabled{opacity:.55;cursor:default}
.cklink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.flast .cklink{color:var(--onnavy,#F4F1EA)}
.fc .cklink{color:var(--onnavy2,#B9C4D6);text-decoration:none}
.fc .cklink:hover{color:var(--onnavy,#F4F1EA);text-decoration:underline}
@media (max-width:600px){.ck{left:8px;bottom:8px;width:calc(100vw - 16px);padding:22px 18px 18px;border-radius:22px 22px 0 0}.ck h2{font-size:26px}}
.cu{position:fixed;right:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border:0;border-radius:999px 999px 0 0;background:var(--gold,#E6A82A);color:var(--ink,#0B1830);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 0 2px var(--ground,#FAF8F3),0 8px 24px rgba(11,24,48,.25);transition:background-color .16s,color .16s}
.cu:hover{background:var(--ink,#0B1830);color:var(--gold,#E6A82A)}
.tk{position:fixed;right:16px;bottom:80px;z-index:45;width:min(370px,calc(100vw - 24px));height:min(520px,calc(100svh - 110px));display:flex;flex-direction:column;background:var(--ground,#FAF8F3);color:var(--ink,#0B1830);border-radius:24px 24px 0 0;box-shadow:0 18px 50px rgba(11,24,48,.3);overflow:hidden;font-size:16px;line-height:1.5;text-align:left}
.tkh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 14px 16px 22px;background:var(--ink,#0B1830);color:var(--onnavy,#F4F1EA)}
.tkh strong{display:block;font-size:17px}
.tkh span{display:block;font-size:14px;color:var(--onnavy2,#B9C4D6)}
.tkx{width:42px;height:42px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:var(--onnavy,#F4F1EA);cursor:pointer;display:grid;place-items:center}
.tkx:hover{background:rgba(244,241,234,.12)}
.tkb{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.tkb p{margin:0;max-width:85%;padding:10px 14px;line-height:1.4}
.tkb .them{align-self:flex-start;background:var(--tone,#EFEADF);border-radius:16px 16px 16px 4px}
.tkb .me{align-self:flex-end;background:var(--ink,#0B1830);color:var(--onnavy,#F4F1EA);border-radius:16px 16px 4px 16px}
.tkb .tkm,.tkb .tkm2{max-width:none;padding:0}
.tkb .tkm2{color:var(--muted,#46526A);font-size:15px}
.tkb .ckbtn{flex:0 0 auto}
.tkf{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--tone,#EFEADF)}
.tkf textarea{flex:1;min-width:0;resize:none;border:1px solid #CFC8B8;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;min-height:46px;background:#fff;color:var(--ink,#0B1830)}
.tks{min-height:46px;padding:0 18px;border:0;border-radius:999px 999px 0 0;background:var(--gold,#E6A82A);color:var(--ink,#0B1830);font:inherit;font-weight:700;cursor:pointer}
.tks[disabled]{opacity:.5;cursor:not-allowed}
.tkn{margin:0;padding:0 14px 12px;font-size:13px;color:var(--muted,#46526A)}
@media (max-width:960px){.cu{min-height:46px;padding:0 16px;font-size:16px;right:12px;bottom:12px}.tk{right:12px;bottom:70px}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="pg">
<header class="bar">
<a class="wm" href="index.html"><i aria-hidden="true"></i>[church name]</a>
<a class="back" href="index.html">Back to the website</a>
</header>
<main class="stage">
<div class="arch">
<h1>welcome back</h1>
<p class="sub">For members, ministry teams and admins.</p>
<form>
<div class="fl"><label for="l-email">Email</label><input id="l-email" class="in" type="email" autocomplete="email"></div>
<div class="fl"><div class="row"><label for="l-pass">Password</label><a href="forgot-password.html">Forgot it?</a></div><input id="l-pass" class="in" type="password" autocomplete="current-password"></div>
<div class="ts"><b aria-hidden="true"></b><span>Verify you are human</span></div>
<a class="go" href="account.html">Log in</a>
</form>
<p class="alt">New here? <a href="signup.html">Create a member account</a></p>
</div>
</main>
<p class="mfa">Admins confirm each log-in with a six-digit code from an authenticator app. <a class="back" href="admin-two-factor.html">See the admin step</a></p>
<sc-if value="{{cu.open}}">
<section class="tk" id="tawk" aria-label="Contact us chat">
<div class="tkh"><div><strong>[Church Name]</strong><span>We usually reply within a few minutes</span></div><button type="button" class="tkx" aria-label="Minimise chat" onClick="{{cu.toggle}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<sc-if value="{{cu.allowed}}">
<div class="tkb" aria-live="polite">
<sc-for list="{{cu.msgs}}" as="m" hint-placeholder-count="1"><p class="{{m.cls}}">{{m.text}}</p></sc-for>
</div>
<div class="tkf"><label class="sr" for="tk-in">Your message</label><textarea id="tk-in" rows="2" placeholder="Type your message" value="{{cu.draft}}" onInput="{{cu.type}}"></textarea><button type="button" class="tks" onClick="{{cu.send}}" disabled="{{cu.cantSend}}">Send</button></div>
<p class="tkn">Preview. The live site shows the Tawk.to chat here.</p>
</sc-if>
<sc-if value="{{cu.blocked}}">
<div class="tkb">
<p class="tkm">Live chat is run by Tawk.to, which uses cookies. Allow live chat to start a conversation with the church.</p>
<button type="button" class="ckbtn yes" onClick="{{cu.allow}}">Allow live chat</button>
<p class="tkm2">Or email us at [Email address], or call [Phone number].</p>
</div>
</sc-if>
</section>
</sc-if>
<sc-if value="{{cu.launcher}}">
<button type="button" class="cu" aria-expanded="{{cu.expanded}}" aria-controls="tawk" onClick="{{cu.toggle}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg><span>{{cu.label}}</span></button>
</sc-if>
<sc-if value="{{ck.open}}">
<section class="ck" role="dialog" aria-modal="false" aria-labelledby="ck-h" aria-describedby="ck-d">
<h2 id="ck-h">your privacy</h2>
<sc-if value="{{ck.simple}}">
<p id="ck-d">We use cookies to keep this site safe and working. With your permission, we would also like to use them for live chat (Tawk.to), for videos, posts and maps from YouTube, Facebook, Instagram and Google, and to count visits with Google Analytics. We never sell your data. <a href="privacy.html">Privacy policy</a></p>
<div class="ckb"><button type="button" class="ckbtn yes" onClick="{{ck.all}}">Accept all</button><button type="button" class="ckbtn no" onClick="{{ck.none}}">Reject all</button></div>
<button type="button" class="cktl" onClick="{{ck.custom}}">Choose which cookies</button>
</sc-if>
<sc-if value="{{ck.detail}}">
<p id="ck-d">Choose what you are happy with. You can change this at any time from Cookie settings at the bottom of the page. <a href="privacy.html">Privacy policy</a></p>
<ul class="ckl">
<li><div><strong>Needed for the site</strong><span>Security checks (Cloudflare Turnstile), secure giving (Stripe) and remembering this choice. Always on.</span></div><button type="button" class="sw" role="switch" aria-checked="true" aria-label="Needed for the site, always on" disabled></button></li>
<sc-for list="{{ck.rows}}" as="r" hint-placeholder-count="3"><li><div><strong>{{r.name}}</strong><span>{{r.desc}}</span></div><button type="button" class="sw" role="switch" aria-checked="{{r.on}}" aria-label="{{r.name}}" onClick="{{r.flip}}"></button></li></sc-for>
</ul>
<div class="ckb"><button type="button" class="ckbtn yes" onClick="{{ck.save}}">Save my choices</button><button type="button" class="ckbtn no" onClick="{{ck.all}}">Accept all</button></div>
</sc-if>
</section>
</sc-if>
</div>
</template>
<noscript><p style="padding:24px;font-family:system-ui,sans-serif">Please turn on JavaScript to view this page.</p></noscript>

<script>
class Component extends PageLogic {
  pageVals(consent) {
    return {};
  }
  ckRead() {
    try {
      const v = JSON.parse(window.localStorage.getItem('church-consent-v1') || 'null');
      if (v && typeof v === 'object') return v;
    } catch (e) {}
    return null;
  }
  ckSet(v) {
    const rec = { chat: !!v.chat, media: !!v.media, analytics: !!v.analytics, at: new Date().toISOString() };
    try { window.localStorage.setItem('church-consent-v1', JSON.stringify(rec)); } catch (e) {}
    try {
      if (typeof window.gtag === 'function') {
        window.gtag('consent', 'update', { analytics_storage: rec.analytics ? 'granted' : 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      }
    } catch (e) {}
    this._ckSaved = rec;
    this.setState({ ckOpen: false, ckView: 'simple', ckDraft: null });
  }
  consentVals() {
    if (!this._ckLoaded) { this._ckLoaded = true; this._ckSaved = this.ckRead(); }
    const saved = this._ckSaved;
    const open = !saved || !!this.state.ckOpen;
    const view = this.state.ckView || 'simple';
    const draft = this.state.ckDraft || saved || { chat: false, media: false, analytics: false };
    const defs = [
      ['chat', 'Live chat', 'Tawk.to, for the Contact us chat.'],
      ['media', 'Videos, posts and maps', 'The YouTube live stream and sermons, Facebook and Instagram posts, and Google Maps.'],
      ['analytics', 'Visit counts', 'Google Analytics, so we can see which pages help people. No advertising.']
    ];
    const rows = defs.map(([k, name, desc]) => ({
      name, desc,
      on: draft[k] ? 'true' : 'false',
      flip: () => this.setState({ ckDraft: Object.assign({}, draft, { [k]: !draft[k] }) })
    }));
    return {
      ck: {
        open, rows,
        simple: view === 'simple',
        detail: view === 'detail',
        all: () => this.ckSet({ chat: true, media: true, analytics: true }),
        none: () => this.ckSet({ chat: false, media: false, analytics: false }),
        custom: () => this.setState({ ckView: 'detail', ckDraft: draft }),
        save: () => this.ckSet(draft)
      },
      chatAllowed: !!(saved && saved.chat),
      openCookies: () => this.setState({ ckOpen: true, ckView: 'detail', ckDraft: null })
    };
  }
  contactVals(consent) {
    const msgs = this.state.cuMsgs || [{ cls: 'them', text: 'Hello, and welcome. How can we help today? Ask about a visit, prayer, giving or anything else.' }];
    const draft = this.state.cuDraft || '';
    const isOpen = !!this.state.cuOpen && !consent.ck.open;
    return {
      cu: {
        launcher: !consent.ck.open,
        open: isOpen,
        expanded: isOpen ? 'true' : 'false',
        label: isOpen ? 'Close' : 'Contact us',
        toggle: () => this.setState({ cuOpen: !this.state.cuOpen }),
        allowed: consent.chatAllowed,
        blocked: !consent.chatAllowed,
        msgs, draft,
        cantSend: !draft.trim(),
        type: (e) => this.setState({ cuDraft: e.target.value }),
        send: () => {
          const t = draft.trim();
          if (!t) return;
          const next = msgs.concat([{ cls: 'me', text: t }]);
          if (!msgs.some((m) => m.cls === 'me')) next.push({ cls: 'them', text: 'Thank you. Someone from the church will answer here shortly. If we are away, leave your email and we will write back.' });
          this.setState({ cuDraft: '', cuMsgs: next });
        },
        allow: () => this.ckSet(Object.assign({}, this._ckSaved || {}, { chat: true }))
      },
      openContact: () => this.setState({ cuOpen: true })
    };
  }
  renderVals() {
    const c = this.consentVals();
    return Object.assign({}, this.pageVals(c), c, this.contactVals(c));
  }
}
window.__boot(Component, {});

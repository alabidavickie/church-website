<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Sermons and live stream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F3}
a{color:#0B1830}a:hover{color:#0B1830}
.pg{--ground:#FAF8F3;--tone:#EFEADF;--ink:#0B1830;--muted:#46526A;--gold:#E6A82A;--navy2:#16294A;--onnavy:#F4F1EA;--onnavy2:#B9C4D6;--focus:#0B1830;--fs-s:14px;--fs-b:clamp(17px,1rem + .25vw,19px);--fs-l:clamp(20px,1.1rem + .7vw,26px);--fs-h:clamp(36px,1.3rem + 3.2vw,64px);--fs-x:clamp(56px,6.4vw,104px);--m:clamp(16px,4vw,56px);font-family:Figtree,system-ui,sans-serif;font-size:var(--fs-b);line-height:1.5;color:var(--ink);background:var(--ground);overflow-x:clip}
.pg *{box-sizing:border-box}
.pg{color-scheme:only light}
.hd{padding-top:14px;padding-bottom:6px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px}
.menu{display:flex;flex-wrap:wrap;gap:0 26px;margin-top:6px}
.menu a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:inherit;text-decoration:none;border-bottom:3px solid transparent;transition:border-color .16s}
.menu a:hover,.menu a[aria-current]{border-color:var(--gold)}
@media (max-width:960px){.hd-top{min-height:52px}.hd .wm{font-size:24px}.menu{gap:0 18px;margin-top:4px}.menu a{font-size:16px;min-height:42px}.sec{padding:44px 0}}
.d{font-family:'League Spartan',Figtree,sans-serif;font-weight:700;letter-spacing:-.04em;line-height:.9}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--m)}
.sec{padding:clamp(96px,11vw,184px) 0}
.navy{background:var(--ink);color:var(--onnavy);--focus:#E6A82A}
.pg a:focus-visible,.pg button:focus-visible,.pg input:focus-visible,.pg select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:999px 999px 0 0;background:var(--gold);color:var(--ink);font:inherit;font-weight:700;text-decoration:none;border:0;cursor:pointer;transition:background-color .16s,color .16s,transform .12s}
.btn:hover{background:var(--ink);color:var(--ground)}
.navy .btn:hover{background:var(--ground);color:var(--ink)}
.btn.sm{min-height:46px;padding:0 22px;font-size:16px}
.tl{color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:var(--gold);transition:text-decoration-thickness .16s}
.tl:hover{text-decoration-thickness:4px;color:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;min-height:88px}
.wm{display:flex;align-items:center;gap:12px;font-family:'League Spartan',Figtree,sans-serif;font-weight:700;font-size:28px;letter-spacing:-.04em;color:inherit;text-decoration:none}
.wm i{width:22px;height:28px;border-radius:11px 11px 0 0;background:var(--gold);display:block}
.nav{display:flex;align-items:center;gap:28px}
.nl{font-weight:600;color:inherit;text-decoration:none;padding:10px 0;border-bottom:3px solid transparent;transition:border-color .16s}
.nl:hover,.nl[aria-current]{border-color:var(--gold)}
.top{padding-bottom:clamp(72px,8vw,128px)}
.watch{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;row-gap:32px;align-items:end;padding-top:clamp(32px,4vw,64px)}
.player{grid-column:1/9;aspect-ratio:16/9;background:#13243F;color:var(--onnavy2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px}
.wtx{grid-column:9/13}
.wtx h1{font-size:clamp(44px,4.6vw,76px);margin:0}
.wtx .t{font-size:var(--fs-l);line-height:1.3;margin:24px 0 8px;color:var(--onnavy)}
.wtx p{margin:0;color:var(--onnavy2)}
.wa{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin-top:28px}
.wa a.tl{color:var(--onnavy)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#F26D5B;margin-right:10px;animation:pulse 1.6s ease-in-out infinite}
.cat{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:40px}
.hh{font-size:var(--fs-h);margin:0}
.cnt{color:var(--muted);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:24px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl label{font-size:15px;font-weight:700}
.in{height:52px;border:0;background:var(--tone);color:var(--ink);font:inherit;font-size:17px;padding:0 16px;border-radius:0}
.types{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 56px}
.ty{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:8px 0;font:inherit;font-weight:700;font-size:var(--fs-l);color:var(--muted);min-height:44px}
.ty i{width:14px;height:18px;border-radius:7px 7px 0 0;background:transparent}
.ty.on{color:var(--ink)}
.ty.on i{background:var(--gold)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:40px}
.row{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:28px;align-items:center}
.thumb{width:132px;height:160px;border-radius:66px 66px 0 0;display:flex;align-items:flex-end;padding:14px;overflow:hidden}
.thumb span{font-family:'League Spartan',Figtree,sans-serif;font-weight:700;letter-spacing:-.04em;font-size:22px;line-height:.95}
.meta{margin:0;color:var(--muted)}
.rt{font-size:clamp(28px,2.4vw,40px);margin:6px 0 8px;line-height:1}
.rl{display:flex;flex-wrap:wrap;gap:8px 24px}
.more{margin-top:56px}
.never{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:center}
.never h2{grid-column:1/8;font-size:var(--fs-h);margin:0}
.never div{grid-column:9/13}
.never p{color:var(--onnavy2);margin:0 0 20px}
.never a.tl{color:var(--onnavy);margin-right:24px}
.foot{padding:56px 0 32px}
.mark{display:flex;align-items:flex-end;gap:4px;height:140px}
.mark i{flex:1;border-radius:999px 999px 0 0;display:block}
.flast{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 32px;margin-top:40px;font-size:15px;color:var(--onnavy2)}
.flast nav{display:flex;flex-wrap:wrap;gap:8px 24px}
.flast a{color:var(--onnavy)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.player{animation:rise .9s .1s cubic-bezier(.2,.7,.1,1) both}
.wtx{animation:rise .9s .25s cubic-bezier(.2,.7,.1,1) both}
@supports (animation-timeline: view()){.rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 22%}}
@media (prefers-reduced-motion: reduce){.pg *{animation:none!important;transition:none!important}}
@media (max-width: 960px){
.nav .nl{display:none}
.watch,.never{display:block}
.wtx{margin-top:28px}
.row{grid-template-columns:88px minmax(0,1fr);gap:18px}
.row .when{display:none}
.thumb{width:88px;height:108px;border-radius:44px 44px 0 0}
.thumb span{font-size:15px}
.never div{margin-top:24px}
}
.ck{position:fixed;left:16px;bottom:16px;z-index:60;width:min(560px,calc(100vw - 32px));max-height:calc(100svh - 32px);overflow:auto;background:var(--ink,#0B1830);color:var(--onnavy,#F4F1EA);border-radius:28px 28px 0 0;box-shadow:0 0 0 1px rgba(244,241,234,.22),0 22px 60px rgba(0,0,0,.45);padding:28px 28px 24px;font-size:16px;line-height:1.5;text-align:left;--focus:#E6A82A}
.ck h2{font-family:'League Spartan',Figtree,sans-serif;font-weight:700;letter-spacing:-.03em;line-height:1;font-size:30px;margin:0 0 10px;color:var(--gold,#E6A82A)}
.ck p{margin:0 0 18px;color:var(--onnavy2,#B9C4D6)}
.ck a{color:var(--onnavy,#F4F1EA);text-decoration:underline;text-underline-offset:3px}
.ckb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ckbtn{flex:1 1 130px;min-height:50px;padding:0 14px;white-space:nowrap;border:0;border-radius:999px 999px 0 0;font:inherit;font-weight:700;cursor:pointer;transition:background-color .16s,color .16s}
.ckbtn.yes{background:var(--gold,#E6A82A);color:var(--ink,#0B1830)}
.ckbtn.no{background:var(--onnavy,#F4F1EA);color:var(--ink,#0B1830)}
.ckbtn.yes:hover{background:#F2BE52}
.ckbtn.no:hover{background:#FFFFFF}
.cktl{background:none;border:0;padding:14px 0 0;font:inherit;font-weight:600;color:var(--onnavy,#F4F1EA);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.ckl{list-style:none;margin:0 0 18px;padding:0}
.ckl li{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(244,241,234,.16)}
.ckl strong{display:block;color:var(--onnavy,#F4F1EA)}
.ckl span{display:block;font-size:14px;color:var(--onnavy2,#B9C4D6)}
.sw{flex-shrink:0;width:52px;height:30px;margin-top:2px;border-radius:999px;border:0;background:#3A4A66;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#F4F1EA;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--gold,#E6A82A)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--ink,#0B1830)}
.sw:disabled{opacity:.55;cursor:default}
.cklink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.flast .cklink{color:var(--onnavy,#F4F1EA)}
.fc .cklink{color:var(--onnavy2,#B9C4D6);text-decoration:none}
.fc .cklink:hover{color:var(--onnavy,#F4F1EA);text-decoration:underline}
@media (max-width:600px){.ck{left:8px;bottom:8px;width:calc(100vw - 16px);padding:22px 18px 18px;border-radius:22px 22px 0 0}.ck h2{font-size:26px}}
.cu{position:fixed;right:16px;bottom:16px;z-index:40;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 22px;border:0;border-radius:999px 999px 0 0;background:var(--gold,#E6A82A);color:var(--ink,#0B1830);font:inherit;font-weight:700;cursor:pointer;box-shadow:0 0 0 2px var(--ground,#FAF8F3),0 8px 24px rgba(11,24,48,.25);transition:background-color .16s,color .16s}
.cu:hover{background:var(--ink,#0B1830);color:var(--gold,#E6A82A)}
.tk{position:fixed;right:16px;bottom:80px;z-index:45;width:min(370px,calc(100vw - 24px));height:min(520px,calc(100svh - 110px));display:flex;flex-direction:column;background:var(--ground,#FAF8F3);color:var(--ink,#0B1830);border-radius:24px 24px 0 0;box-shadow:0 18px 50px rgba(11,24,48,.3);overflow:hidden;font-size:16px;line-height:1.5;text-align:left}
.tkh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 14px 16px 22px;background:var(--ink,#0B1830);color:var(--onnavy,#F4F1EA)}
.tkh strong{display:block;font-size:17px}
.tkh span{display:block;font-size:14px;color:var(--onnavy2,#B9C4D6)}
.tkx{width:42px;height:42px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:var(--onnavy,#F4F1EA);cursor:pointer;display:grid;place-items:center}
.tkx:hover{background:rgba(244,241,234,.12)}
.tkb{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.tkb p{margin:0;max-width:85%;padding:10px 14px;line-height:1.4}
.tkb .them{align-self:flex-start;background:var(--tone,#EFEADF);border-radius:16px 16px 16px 4px}
.tkb .me{align-self:flex-end;background:var(--ink,#0B1830);color:var(--onnavy,#F4F1EA);border-radius:16px 16px 4px 16px}
.tkb .tkm,.tkb .tkm2{max-width:none;padding:0}
.tkb .tkm2{color:var(--muted,#46526A);font-size:15px}
.tkb .ckbtn{flex:0 0 auto}
.tkf{display:flex;gap:8px;align-items:flex-end;padding:12px;border-top:1px solid var(--tone,#EFEADF)}
.tkf textarea{flex:1;min-width:0;resize:none;border:1px solid #CFC8B8;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;min-height:46px;background:#fff;color:var(--ink,#0B1830)}
.tks{min-height:46px;padding:0 18px;border:0;border-radius:999px 999px 0 0;background:var(--gold,#E6A82A);color:var(--ink,#0B1830);font:inherit;font-weight:700;cursor:pointer}
.tks[disabled]{opacity:.5;cursor:not-allowed}
.tkn{margin:0;padding:0 14px 12px;font-size:13px;color:var(--muted,#46526A)}
@media (max-width:960px){.cu{min-height:46px;padding:0 16px;font-size:16px;right:12px;bottom:12px}.tk{right:12px;bottom:70px}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.stk{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(250,248,243,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(11,24,48,.08),0 8px 24px rgba(11,24,48,.08);animation:stkin .22s ease-out}
@keyframes stkin{from{transform:translateY(-100%)}to{transform:none}}
.stk-in{max-width:1360px;margin:0 auto;padding:0 var(--m,16px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px;min-height:64px}
.stk-wm{display:flex;align-items:center;gap:10px;min-height:44px;font-family:'League Spartan',Figtree,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.04em;color:var(--ink);text-decoration:none;white-space:nowrap}
.stk-wm i{width:16px;height:21px;border-radius:8px 8px 0 0;background:var(--gold);display:block;flex-shrink:0}
.stk-menu{display:flex;gap:0 22px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stk-menu::-webkit-scrollbar{display:none}
.stk-menu a{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;transition:border-color .16s}
.stk-menu a:hover,.stk-menu a[aria-current]{border-color:var(--gold)}
.stk-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px 999px 0 0;background:var(--gold);color:var(--ink);font-weight:700;text-decoration:none;white-space:nowrap;transition:background-color .16s,color .16s}
.stk-btn:hover{background:var(--ink);color:var(--ground,#FAF8F3)}
.pg [id]{scroll-margin-top:116px}
@media (max-width:1100px){
.stk-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"wm btn" "menu menu";gap:0 16px;min-height:0;padding-top:6px}
.stk-wm{grid-area:wm;font-size:20px}
.stk-btn{grid-area:btn;min-height:40px;padding:0 16px;font-size:15px}
.stk-menu{grid-area:menu;margin:0 calc(-1 * var(--m,16px));padding:0 var(--m,16px);-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}
.stk-menu a{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.stk{animation:none}}
@media (max-width:960px){
.flast nav a,.flast .cklink{display:inline-flex;align-items:center;min-height:44px}
.fc a,.fc .cklink{display:inline-flex;align-items:center;min-height:36px}
}
.hd-r{display:flex;align-items:center;gap:20px}
.srch{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;justify-content:center;font-weight:600;color:var(--ink);text-decoration:none}
.srch:hover span{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:6px}
@media (max-width:600px){.srch span{display:none}.hd-r{gap:6px}.hd .hd-top{gap:10px}.hd .wm{font-size:clamp(18px,5.4vw,24px);gap:8px;white-space:nowrap}.hd .wm i{width:16px;height:21px}.srch{min-width:40px}.hd-r .btn.sm{padding:0 14px;font-size:15px}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="pg">
<div class="navy top">
<header class="wrap hd">
<div class="hd-top">
<a class="wm" href="index.html"><i aria-hidden="true"></i>[church name]</a>
<div class="hd-r"><a class="srch" href="search.html" aria-label="Search"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span>Search</span></a><a class="btn sm" href="offerings.html">Offering</a></div>
</div>
<nav class="menu" aria-label="Main">
<a href="todays-message.html">Today's Message</a>
<a href="index.html#week">Services</a>
<a href="bible-study.html">Bible Study</a>
<a href="sermons.html" aria-current="page">Sermons</a>
<a href="events.html">Events</a>
<a href="prayer.html">Prayer</a>
<a href="testimonies.html">Testimonies</a>
<a href="im-new.html">I'm New</a>
</nav>
</header>
<sc-if value="{{stk.show}}">
<div class="stk">
<div class="stk-in">
<a class="stk-wm" href="index.html"><i aria-hidden="true"></i>[church name]</a>
<nav class="stk-menu" aria-label="Main menu, compact">
<a href="todays-message.html">Today's Message</a>
<a href="index.html#week">Services</a>
<a href="bible-study.html">Bible Study</a>
<a href="sermons.html" aria-current="page">Sermons</a>
<a href="events.html">Events</a>
<a href="prayer.html">Prayer</a>
<a href="testimonies.html">Testimonies</a>
<a href="im-new.html">I'm New</a>
</nav>
<a class="stk-btn" href="offerings.html">Offering</a>
</div>
</div>
</sc-if>
<section class="wrap watch" aria-labelledby="h-watch">
<div class="player"><svg aria-hidden="true" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M10 8.5l5 3.5-5 3.5z"></path></svg><span>{{playerNote}}</span></div>
<div class="wtx">
<sc-if value="{{live}}" hint-placeholder-val="{{ false }}">
<h1 id="h-watch" class="d">we're live</h1>
<p class="t"><span class="dot" aria-hidden="true"></span>Sunday Service, streaming now from 6400B Frederick Road.</p>
<p>Tap the player to turn the sound on. You can send a prayer request while you watch.</p>
</sc-if>
<sc-if value="{{notLive}}" hint-placeholder-val="{{ true }}">
<h1 id="h-watch" class="d">watch &amp; listen</h1>
<p class="t">Latest: faith on the road</p>
<p>[Pastor's name] · Sunday, October 25 · Luke 24:13–35</p>
</sc-if>
<div class="wa"><a class="btn" href="{{mainHref}}">{{mainAction}}</a><a class="tl" href="bible-study.html">Past Bible Studies</a></div>
</div>
</section>
</div>

<main>
<section class="sec" aria-labelledby="h-arch">
<div class="wrap">
<div class="cat rv"><h2 id="h-arch" class="d hh">past sermons</h2><span class="cnt">{{countLabel}}</span></div>
<form class="filters" role="search">
<div class="fl" style="flex: 1 1 320px"><label for="s-q">Search</label><input id="s-q" class="in" type="search" placeholder="A topic, a title or a verse"></div>
<div class="fl" style="flex: 0 1 200px"><label for="s-sp">Speaker</label><select id="s-sp" class="in"><option>Everyone</option><option>[Pastor's name]</option></select></div>
<div class="fl" style="flex: 0 1 200px"><label for="s-se">Series</label><select id="s-se" class="in"><option>All series</option><option>[Series name]</option></select></div>
<div class="fl" style="flex: 0 1 200px"><label for="s-bk">Book of the Bible</label><select id="s-bk" class="in"><option>All books</option><option>Romans</option><option>Psalms</option></select></div>
</form>
<p class="types">Looking for a Tuesday study? <a class="tl" href="bible-study.html">Browse past Bible studies</a></p>
<ul class="list">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<li class="row">
<span class="thumb" style="{{it.thumbStyle}}" aria-hidden="true"><span>{{it.title}}</span></span>
<div>
<p class="meta">{{it.meta}}</p>
<h3 class="d rt">{{it.title}}</h3>
<p class="rl"><a class="tl" href="sermon-detail.html">Watch</a><a class="tl" href="todays-message.html#previous">Read the message</a><span style="color: var(--muted)">{{it.scripture}}</span></p>
</div>

<script>
class Component extends PageLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'all' };
  }
  pageVals(consent) {
    const live = this.props.live ?? false;
    const all = [
      { kind: 'sermon', title: 'faith on the road', meta: 'Sunday, October 25 · [Pastor’s name]', scripture: 'Luke 24:13–35', length: '[min]', bg: '#E6A82A', fg: '#0B1830' },
      { kind: 'sermon', title: 'the god who sees', meta: 'Sunday, October 18 · [Pastor’s name]', scripture: 'Genesis 16:1–13', length: '[min]', bg: '#2B4470', fg: '#F4F1EA' },
      { kind: 'sermon', title: 'come and rest', meta: 'Sunday, October 11 · [Pastor’s name]', scripture: 'Matthew 11:28–30', length: '[min]', bg: '#EFEADF', fg: '#0B1830' },
      { kind: 'sermon', title: 'a table for all', meta: 'Sunday, October 4 · [Pastor’s name]', scripture: 'Luke 14:15–24', length: '[min]', bg: '#0B1830', fg: '#E6A82A' },
      { kind: 'sermon', title: 'planted by the water', meta: 'Sunday, September 27 · [Pastor’s name]', scripture: 'Psalm 1', length: '[min]', bg: '#E6A82A', fg: '#0B1830' }
    ];
    const t = this.state.type;
    const items = all.map((x) => ({ ...x, thumbStyle: 'background: ' + x.bg + '; color: ' + x.fg }));
    const types = [['all', 'Everything'], ['sermon', 'Sunday sermons'], ['study', 'Bible studies']].map(([id, label]) => ({
      label, cls: t === id ? 'on' : '', pressed: t === id ? 'true' : 'false', pick: () => this.setState({ type: id })
    }));
    return {
      live,
      notLive: !live,
      playerNote: live ? '[YouTube live player: Sunday Service, playing now]' : '[YouTube player: the latest message]',
      mainAction: live ? 'Send a prayer request' : 'Read Today’s Message',
      mainHref: live ? 'Main.dc.html#prayer' : 'TodaysMessage.dc.html',
      types,
      items,
      countLabel: items.length + ' most recent'
    };
  }
  ckRead() {
    try {
      const v = JSON.parse(window.localStorage.getItem('church-consent-v1') || 'null');
      if (v && typeof v === 'object') return v;
    } catch (e) {}
    return null;
  }
  ckSet(v) {
    const rec = { chat: !!v.chat, media: !!v.media, analytics: !!v.analytics, at: new Date().toISOString() };
    try { window.localStorage.setItem('church-consent-v1', JSON.stringify(rec)); } catch (e) {}
    try {
      if (typeof window.gtag === 'function') {
        window.gtag('consent', 'update', { analytics_storage: rec.analytics ? 'granted' : 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      }
    } catch (e) {}
    this._ckSaved = rec;
    this.setState({ ckOpen: false, ckView: 'simple', ckDraft: null });
  }
  consentVals() {
    if (!this._ckLoaded) { this._ckLoaded = true; this._ckSaved = this.ckRead(); }
    const saved = this._ckSaved;
    const open = !saved || !!this.state.ckOpen;
    const view = this.state.ckView || 'simple';
    const draft = this.state.ckDraft || saved || { chat: false, media: false, analytics: false };
    const defs = [
      ['chat', 'Live chat', 'Tawk.to, for the Contact us chat.'],
      ['media', 'Videos, posts and maps', 'The YouTube live stream and sermons, Facebook and Instagram posts, and Google Maps.'],
      ['analytics', 'Visit counts', 'Google Analytics, so we can see which pages help people. No advertising.']
    ];
    const rows = defs.map(([k, name, desc]) => ({
      name, desc,
      on: draft[k] ? 'true' : 'false',
      flip: () => this.setState({ ckDraft: Object.assign({}, draft, { [k]: !draft[k] }) })
    }));
    return {
      ck: {
        open, rows,
        simple: view === 'simple',
        detail: view === 'detail',
        all: () => this.ckSet({ chat: true, media: true, analytics: true }),
        none: () => this.ckSet({ chat: false, media: false, analytics: false }),
        custom: () => this.setState({ ckView: 'detail', ckDraft: draft }),
        save: () => this.ckSet(draft)
      },
      chatAllowed: !!(saved && saved.chat),
      openCookies: () => this.setState({ ckOpen: true, ckView: 'detail', ckDraft: null })
    };
  }
  contactVals(consent) {
    const msgs = this.state.cuMsgs || [{ cls: 'them', text: 'Hello, and welcome. How can we help today? Ask about a visit, prayer, giving or anything else.' }];
    const draft = this.state.cuDraft || '';
    const isOpen = !!this.state.cuOpen && !consent.ck.open;
    return {
      cu: {
        launcher: !consent.ck.open,
        open: isOpen,
        expanded: isOpen ? 'true' : 'false',
        label: isOpen ? 'Close' : 'Contact us',
        toggle: () => this.setState({ cuOpen: !this.state.cuOpen }),
        allowed: consent.chatAllowed,
        blocked: !consent.chatAllowed,
        msgs, draft,
        cantSend: !draft.trim(),
        type: (e) => this.setState({ cuDraft: e.target.value }),
        send: () => {
          const t = draft.trim();
          if (!t) return;
          const next = msgs.concat([{ cls: 'me', text: t }]);
          if (!msgs.some((m) => m.cls === 'me')) next.push({ cls: 'them', text: 'Thank you. Someone from the church will answer here shortly. If we are away, leave your email and we will write back.' });
          this.setState({ cuDraft: '', cuMsgs: next });
        },
        allow: () => this.ckSet(Object.assign({}, this._ckSaved || {}, { chat: true }))
      },
      openContact: () => this.setState({ cuOpen: true })
    };
  }
  stickyVals() {
    if (!this._stkInit && typeof window !== 'undefined') {
      this._stkInit = true;
      const check = () => {
        const hd = document.querySelector('header.hd');
        if (!hd) return;
        const s = hd.getBoundingClientRect().bottom < 0;
        if (s !== !!this._stk) { this._stk = s; this.setState({ stkTick: Date.now() }); }
      };
      window.addEventListener('scroll', check, { passive: true });
      window.addEventListener('resize', check);
      setTimeout(check, 0);
    }
    return { stk: { show: !!this._stk } };
  }
  renderVals() {
    const c = this.consentVals();
    return Object.assign({}, this.pageVals(c), c, this.contactVals(c), this.stickyVals());
  }
}
window.__boot(Component, {"live":false});
</script>

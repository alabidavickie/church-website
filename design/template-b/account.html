<style>
body{margin:0;background:#FAF8F3}
a{color:#0B1830}a:hover{color:#0B1830}
.pg{color-scheme:only light;--ground:#FAF8F3;--tone:#EFEADF;--ink:#0B1830;--muted:#46526A;--gold:#E6A82A;--navy2:#16294A;--onnavy:#F4F1EA;--onnavy2:#B9C4D6;--ok:#1F6A50;--okt:#E3F1EC;--bad:#8E2F23;--badt:#FBE7E4;--focus:#0B1830;--fs-s:14px;--fs-b:clamp(17px,1rem + .25vw,19px);--fs-l:clamp(20px,1.1rem + .7vw,26px);--fs-h:clamp(34px,1.2rem + 3vw,60px);--m:clamp(16px,4vw,56px);font-family:Figtree,system-ui,sans-serif;font-size:var(--fs-b);line-height:1.5;color:var(--ink);background:var(--ground);overflow-x:clip}

}

<div class="row1"><div><p class="d kick">my account</p><h1 class="d h1" id="acc-h">hello, {{first}}</h1></div><a class="tl out" href="index.html">Log out</a></div>
<p class="intro">Your details, your giving, your reminders and your testimonies, all in one place.</p>
<div class="tabs" role="tablist" aria-label="My account">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button type="button" class="tab" role="tab" id="{{t.tid}}" aria-selected="{{t.sel}}" aria-controls="{{t.pid}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>

</div>

<sc-if value="{{is.profile}}">
<section class="panel" role="tabpanel" id="p-profile" aria-labelledby="t-profile">
<div class="wrap cols">
<div class="c7">
<h2 class="d ph">your details</h2>
<p class="pp">We use these to send your receipts and reminders. We never share them.</p>
<div class="frm form">
<div class="fl"><label for="a-first">First name</label><input id="a-first" class="in" autocomplete="given-name" value="{{first}}" onInput="{{setFirst}}"></div>
<div class="fl"><label for="a-last">Last name</label><input id="a-last" class="in" autocomplete="family-name" value="{{last}}" onInput="{{setLast}}"></div>
<div class="fl w2"><label for="a-email">Email</label><input id="a-email" class="in" type="email" autocomplete="email" value="{{email}}" onInput="{{setEmail}}"><p class="hint">If you change it, we will send a link to the new address to confirm it.</p></div>
<div class="fl w2"><label for="a-phone">Phone <span style="font-weight: 400">(optional)</span></label><input id="a-phone" class="in" type="tel" autocomplete="tel" value="{{phone}}" onInput="{{setPhone}}"></div>
<div class="w2"><button type="button" class="ts {{ts.cls}}" aria-pressed="{{ts.pressed}}" onClick="{{ts.verify}}"><b aria-hidden="true"><sc-if value="{{ts.ok}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></b>{{ts.label}}</button></div>
<div class="w2 acts"><button type="button" class="btn" disabled="{{cantSave}}" onClick="{{saveP}}">Save changes</button><sc-if value="{{savedP}}"><span class="ok-box" role="status">Saved.</span></sc-if></div>
</div>
</div>
<aside class="c5 side" aria-label="Sign-in and data">
<h3>Password</h3>
<p>Choose a new password at any time.</p>
<a class="btnline" href="reset-password.html">Change my password</a>
<div class="danger">
<h3>Delete my account</h3>
<sc-if value="{{notDel}}"><p>This removes your account, reminders and testimonies. Gift records are kept as the law requires.</p><button type="button" class="btnline bad" onClick="{{askDel}}">Delete my account</button></sc-if>
<sc-if value="{{del}}"><p role="status"><strong>Are you sure?</strong> This cannot be undone.</p><div class="acts"><button type="button" class="btnline bad" onClick="{{askDel}}">Yes, delete it</button><button type="button" class="tl" onClick="{{cancelDel}}">Keep my account</button></div></sc-if>
</div>
</aside>
</div>
</section>
</sc-if>

<sc-if value="{{is.giving}}">
<section class="panel" role="tabpanel" id="p-giving" aria-labelledby="t-giving">
<div class="wrap cols">
<div class="c5">
<h2 class="d ph">your monthly offering</h2>
<sc-if value="{{notStopped}}">
<div class="rec">
<p style="margin: 0; color: var(--onnavy2); font-weight: 600">Every month</p>
<p class="amt">$50.00</p>
<dl><dt>Fund</dt><dd>Offering</dd><dt>Next gift</dt><dd>Sunday, November 1</dd><dt>Card</dt><dd>Visa ending 4242</dd></dl>
<sc-if value="{{notStopAsk}}"><div class="acts"><a class="btnline" href="#stripe-portal">Change amount or card</a><button type="button" class="tl" style="color: var(--onnavy)" onClick="{{askStop}}">Stop this offering</button></div>
<p class="small">Changes open Stripe's secure page. We never see your card number.</p></sc-if>
<sc-if value="{{stopAsk}}"><p role="status"><strong>Stop your monthly offering?</strong> No more gifts will be taken. You can start again at any time.</p><div class="acts"><button type="button" class="btnline" onClick="{{doStop}}">Yes, stop it</button><button type="button" class="tl" style="color: var(--onnavy)" onClick="{{keep}}">Keep giving</button></div></sc-if>
</div>
</sc-if>
<sc-if value="{{stopped}}"><div class="ok-box" role="status">Your monthly offering is stopped. Thank you for every gift so far.</div><p style="margin-top: 16px"><a class="btn" href="offerings.html">Give an offering</a></p></sc-if>
</div>
<div class="c7r">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px"><h2 class="d ph">your gifts</h2><a class="tl" href="offerings.html">Give an offering</a></div>
<div class="hist" role="table" aria-label="Your gifts in {{year}}">
<div class="hr" role="row"><span role="columnheader">Date</span><span role="columnheader">Fund</span><span role="columnheader" class="num">Amount</span><span role="columnheader">Receipt</span></div>
<sc-for list="{{gifts}}" as="g" hint-placeholder-count="5"><div class="hr" role="row"><span role="cell">{{g.date}}</span><span role="cell">{{g.fund}}</span><span role="cell" class="num">{{g.amt}}</span><span role="cell"><a class="tl" href="#receipt">Receipt</a></span></div></sc-for>
</div>
<div class="note" style="margin-top: 20px">
<strong>Giving statement for your taxes</strong>
<p style="margin: 6px 0 12px; font-size: 16px">{{year}} total: <strong>{{total}}</strong>. The statement lists every gift with the church's tax ID, [EIN].</p>
<div class="stmt"><div class="fl"><label for="a-year">Year</label><select id="a-year" class="in" value="{{year}}" onChange="{{setYear}}"><option value="2026">2026</option><option value="2025">2025</option></select></div><a class="btn sm" href="#statement">Download statement (PDF)</a></div>
</div>
</div>
</div>
</section>
</sc-if>

<div class="c7">

<sc-for list="{{rems}}" as="r" hint-placeholder-count="5"><li><div><strong>{{r.name}}</strong><span>{{r.when}}</span></div><button type="button" class="sw2" role="switch" aria-checked="{{r.on}}" aria-label="{{r.name}}" onClick="{{r.flip}}"></button></li></sc-for>
</ul>
<p aria-live="polite" style="min-height: 28px; margin: 12px 0 0"><sc-if value="{{remSaved}}"><span class="ok-box" style="display: inline-block; padding: 6px 12px">Saved.</span></sc-if></p>
</div>
<aside class="c5 side"><h3>Text messages?</h3><p>Reminders come by email for now. If the church adds text reminders, you will be able to turn them on here.</p></aside>
</div>
</section>
</sc-if>

<sc-if value="{{is.testimonies}}">
<section class="panel" role="tabpanel" id="p-testimonies" aria-labelledby="t-testimonies">
<div class="wrap cols">
<div class="c12">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px"><h2 class="d ph">your testimonies</h2><a class="btn sm" href="testimony.html">Share a new testimony</a></div>
<p class="pp">Our ministry team reads every testimony before it is published.</p>
<ul class="tlist">
<li class="tcard"><div class="tt"><h3>Healed after surgery</h3><span class="pillx p-ok">Published</span></div><p class="m">Shared Oct 9 · Published Oct 12 · Healing</p><div class="acts"><a class="tl" href="testimonies.html">View it on the website</a></div></li>
<li class="tcard"><div class="tt"><h3>A new job just in time</h3><span class="pillx p-wait">Waiting for review</span></div><p class="m">Shared Oct 24 · Provision</p></li>
<li class="tcard"><div class="tt"><h3>Answered prayer for my mother</h3><span class="pillx p-chg">Changes asked</span></div><p class="m">Shared Oct 18 · Answered prayer</p><p class="fb"><strong>From the ministry team:</strong> Thank you for sharing this. Could you leave out your mother's surname? Then we can publish it.</p><div class="acts"><a class="btn sm" href="testimony.html">Edit and send again</a></div></li>
</ul>
</div>
</div>
</section>

<div class="ckb"><button type="button" class="ckbtn yes" onClick="{{ck.all}}">Accept all</button><button type="button" class="ckbtn no" onClick="{{ck.none}}">Reject all</button></div>
<button type="button" class="cktl" onClick="{{ck.custom}}">Choose which cookies</button>
</sc-if>
<sc-if value="{{ck.detail}}">
<p id="ck-d">Choose what you are happy with. You can change this at any time from Cookie settings at the bottom of the page. <a href="privacy.html">Privacy policy</a></p>
<ul class="ckl">
<li><div><strong>Needed for the site</strong><span>Security checks (Cloudflare Turnstile), secure giving (Stripe) and remembering this choice. Always on.</span></div><button type="button" class="sw" role="switch" aria-checked="true" aria-label="Needed for the site, always on" disabled></button></li>
<sc-for list="{{ck.rows}}" as="r" hint-placeholder-count="3"><li><div><strong>{{r.name}}</strong><span>{{r.desc}}</span></div><button type="button" class="sw" role="switch" aria-checked="{{r.on}}" aria-label="{{r.name}}" onClick="{{r.flip}}"></button></li></sc-for>

<div class="ckb"><button type="button" class="ckbtn yes" onClick="{{ck.save}}">Save my choices</button><button type="button" class="ckbtn no" onClick="{{ck.all}}">Accept all</button></div>
</sc-if>
</section>
</sc-if>
</div>

    const s = this.state;
    const tabs = [['profile', 'Profile'], ['giving', 'My giving'], ['reminders', 'Reminders'], ['testimonies', 'My testimonies']].map(([id, label]) => ({
      label, tid: 't-' + id, pid: 'p-' + id, sel: s.tab === id ? 'true' : 'false', pick: () => this.setState({ tab: id })
    }));
    const is = { profile: s.tab === 'profile', giving: s.tab === 'giving', reminders: s.tab === 'reminders', testimonies: s.tab === 'testimonies' };
    const all = {
      '2026': [['Oct 1, 2026', 'Offering', 50], ['Sep 13, 2026', 'Building Fund', 100], ['Sep 1, 2026', 'Offering', 50], ['Aug 1, 2026', 'Offering', 50], ['Jul 1, 2026', 'Offering', 50], ['Jun 1, 2026', 'Offering', 50]],
      '2025': [['Dec 24, 2025', 'Thanksgiving', 75], ['Dec 1, 2025', 'Offering', 50], ['Nov 1, 2025', 'Offering', 50]]
    };
    const usd = (n) => '$' + n.toFixed(2);
    const rows = all[s.year] || [];
    const remDefs = [['r_bs', 'Bible study', 'Tuesdays · the day before and 1 hour before'], ['r_pr', 'Prayer meeting', 'Fridays · 1 hour before'], ['r_ev', 'Events I register for', 'The day before'], ['r_msg', "Today's Message", 'Sunday afternoons, a short summary of the sermon'], ['r_news', 'Church news', 'About once a month']];
    return {
      tabs, is,
      first: s.first, last: s.last, email: s.email, phone: s.phone,
      setFirst: this.field('first'), setLast: this.field('last'), setEmail: this.field('email'), setPhone: this.field('phone'),
      ts: this.tsVals('tsP'),
      cantSave: !s.tsP,
      saveP: () => { if (s.tsP) this.setState({ savedP: true, tsP: false }); },
      savedP: s.savedP,
      del: s.del, notDel: !s.del, askDel: () => this.setState({ del: true }), cancelDel: () => this.setState({ del: false }),
      stopped: s.stopped, notStopped: !s.stopped, stopAsk: s.stopAsk, notStopAsk: !s.stopAsk,
      askStop: () => this.setState({ stopAsk: true }), keep: () => this.setState({ stopAsk: false }), doStop: () => this.setState({ stopped: true, stopAsk: false }),
      year: s.year, setYear: (e) => this.setState({ year: e.target.value }),
      gifts: rows.map(([date, fund, n]) => ({ date, fund, amt: usd(n) })),
      total: usd(rows.reduce((t, r) => t + r[2], 0)),
      rems: remDefs.map(([k, name, when]) => ({ name, when, on: s[k] ? 'true' : 'false', flip: () => this.setState({ [k]: !s[k], remSaved: true }) })),
      remSaved: s.remSaved,
      noSubmit: (e) => e.preventDefault()
    };
  }

  tsVals(key) {
    const ok = !!this.state[key];
    return {
      ok,
      cls: ok ? 'ok' : '',
      pressed: ok ? 'true' : 'false',
      label: ok ? 'Verified' : 'Verify you are human',
      verify: () => this.setState({ [key]: true })
    };
  }

  chkVals(key) {
    const val = !!this.state[key];
    return { val, on: val ? 'true' : 'false', flip: () => this.setState({ [key]: !this.state[key] }) };
  }

  field(key) { return (e) => this.setState({ [key]: e.target.value, savedP: false }); }
  componentDidMount() {
    try {
      const h = (window.location.hash || '').replace('#', '');
      if (['profile', 'giving', 'reminders', 'testimonies'].indexOf(h) > -1) this.setState({ tab: h });
    } catch (e) {}
  }
  ckRead() {
    try {
      const v = JSON.parse(window.localStorage.getItem('church-consent-v1') || 'null');
      if (v && typeof v === 'object') return v;
    } catch (e) {}
    return null;
  }
  ckSet(v) {
    const rec = { chat: !!v.chat, media: !!v.media, analytics: !!v.analytics, at: new Date().toISOString() };
    try { window.localStorage.setItem('church-consent-v1', JSON.stringify(rec)); } catch (e) {}
    try {
      if (typeof window.gtag === 'function') {
        window.gtag('consent', 'update', { analytics_storage: rec.analytics ? 'granted' : 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      }
    } catch (e) {}
    this._ckSaved = rec;
    this.setState({ ckOpen: false, ckView: 'simple', ckDraft: null });
  }
  consentVals() {
    if (!this._ckLoaded) { this._ckLoaded = true; this._ckSaved = this.ckRead(); }
    const saved = this._ckSaved;
    const open = !saved || !!this.state.ckOpen;
    const view = this.state.ckView || 'simple';
    const draft = this.state.ckDraft || saved || { chat: false, media: false, analytics: false };
    const defs = [
      ['chat', 'Live chat', 'Tawk.to, for the Contact us chat.'],
      ['media', 'Videos, posts and maps', 'The YouTube live stream and sermons, Facebook and Instagram posts, and Google Maps.'],
      ['analytics', 'Visit counts', 'Google Analytics, so we can see which pages help people. No advertising.']
    ];
    const rows = defs.map(([k, name, desc]) => ({
      name, desc,
      on: draft[k] ? 'true' : 'false',
      flip: () => this.setState({ ckDraft: Object.assign({}, draft, { [k]: !draft[k] }) })
    }));
    return {
      ck: {
        open, rows,
        simple: view === 'simple',
        detail: view === 'detail',
        all: () => this.ckSet({ chat: true, media: true, analytics: true }),
        none: () => this.ckSet({ chat: false, media: false, analytics: false }),
        custom: () => this.setState({ ckView: 'detail', ckDraft: draft }),
        save: () => this.ckSet(draft)
      },
      chatAllowed: !!(saved && saved.chat),
      openCookies: () => this.setState({ ckOpen: true, ckView: 'detail', ckDraft: null })
    };
  }
  contactVals(consent) {
    const msgs = this.state.cuMsgs || [{ cls: 'them', text: 'Hello, and welcome. How can we help today? Ask about a visit, prayer, giving or anything else.' }];
    const draft = this.state.cuDraft || '';
    const isOpen = !!this.state.cuOpen && !consent.ck.open;
    return {
      cu: {
        launcher: !consent.ck.open,
        open: isOpen,
        expanded: isOpen ? 'true' : 'false',
        label: isOpen ? 'Close' : 'Contact us',
        toggle: () => this.setState({ cuOpen: !this.state.cuOpen }),
        allowed: consent.chatAllowed,
        blocked: !consent.chatAllowed,
        msgs, draft,
        cantSend: !draft.trim(),
        type: (e) => this.setState({ cuDraft: e.target.value }),
        send: () => {
          const t = draft.trim();
          if (!t) return;
          const next = msgs.concat([{ cls: 'me', text: t }]);
          if (!msgs.some((m) => m.cls === 'me')) next.push({ cls: 'them', text: 'Thank you. Someone from the church will answer here shortly. If we are away, leave your email and we will write back.' });
          this.setState({ cuDraft: '', cuMsgs: next });
        },
        allow: () => this.ckSet(Object.assign({}, this._ckSaved || {}, { chat: true }))
      },
      openContact: () => this.setState({ cuOpen: true })
    };
  }
  stickyVals() {
    if (!this._stkInit && typeof window !== 'undefined') {
      this._stkInit = true;
      const check = () => {
        const hd = document.querySelector('header.hd');
        if (!hd) return;
        const s = hd.getBoundingClientRect().bottom < 0;
        if (s !== !!this._stk) { this._stk = s; this.setState({ stkTick: Date.now() }); }
      };
      window.addEventListener('scroll', check, { passive: true });
      window.addEventListener('resize', check);
      setTimeout(check, 0);
    }
    return { stk: { show: !!this._stk } };
  }
  renderVals() {
    const c = this.consentVals();
    return Object.assign({}, this.pageVals(c), c, this.contactVals(c), this.stickyVals());
  }
}
window.__boot(Component, {});
</script>

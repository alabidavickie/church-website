<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<title>Admin · Post to social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=League+Spartan:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FCFAF4}
a{color:#0B1830}a:hover{color:#0B1830}
.app{--ground:#FCFAF4;--surface:#FFFFFF;--line:#ECE6D8;--ink:#0B1830;--muted:#5A6375;--g50:#FDF7E9;--g100:#FAEBC7;--g500:#E6A82A;--g800:#6B4A07;--ok:#1F6A50;--okt:#E3F1EC;--bad:#8E2F23;--badt:#FBE7E4;font-family:'DM Sans',Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;color:var(--ink);background:var(--ground);display:flex;flex-wrap:wrap;min-height:100vh}
.app *{box-sizing:border-box}
.app a:focus-visible,.app button:focus-visible,.app textarea:focus-visible,.app input:focus-visible,.app select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.side{flex:0 0 240px;padding:20px 12px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;text-decoration:none;color:var(--ink)}
.brand i{width:18px;height:23px;border-radius:9px 9px 0 0;background:var(--g500);display:block}
.brand b{font-family:'League Spartan',sans-serif;font-size:20px;letter-spacing:-.04em;line-height:1}
.brand span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.grp{font-size:12.5px;color:var(--muted);padding:22px 10px 8px}
.ni{display:flex;align-items:center;gap:10px;min-height:34px;padding:0 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
.ni:hover{background:#F3EEE2}
.ni svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
.ni.on{background:var(--g100);color:var(--g800);font-weight:600}
.ni.on svg{color:var(--g500)}
.ni em{margin-left:auto;font-style:normal;font-size:12px;font-weight:600;color:var(--g800);background:var(--g100);border-radius:999px;padding:1px 8px}
.grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;margin-top:12px}
.me b{width:30px;height:30px;border-radius:50%;background:#E6EEF8;color:#1D4E89;display:flex;align-items:center;justify-content:center;font-size:13px}
.me span{font-size:13px;color:var(--muted)}
.me strong{display:block;color:var(--ink);font-weight:600}
.main{flex:999 1 640px;min-width:0;padding:32px 36px 48px}
.title{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:24px}
.title h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.title p{margin:6px 0 0;font-size:15px;color:var(--muted)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px}
.rh{font-size:16px;font-weight:600;margin:0 0 8px}
.rail{display:flex;flex-direction:column;gap:16px}
.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.drop{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px;border:1.5px dashed #D9CFB8;border-radius:12px;background:#FFFEFB}
.thumb{width:96px;height:64px;border-radius:8px;background:#0B1830;color:#E6A82A;display:flex;align-items:center;justify-content:center;font-family:'League Spartan',sans-serif;font-size:14px;letter-spacing:-.02em;flex-shrink:0}
.drop strong{display:block;font-weight:600;overflow-wrap:anywhere}
.drop>div{flex:1 1 140px;min-width:0}
.drop span{font-size:13px;color:var(--muted)}
.drop .b2{margin-left:auto}
.plats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0}
.pc{min-height:61px;padding:10px 12px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.pc span{font-size:13px;color:var(--muted)}
.pc b{font-size:16px;font-weight:600}
.pc.on{border-color:var(--g500);background:var(--g50)}
.field{margin-bottom:16px}
.inp{width:100%;min-height:40px;border:1px solid #E3DCCB;border-radius:10px;padding:0 12px;font:inherit;background:#FFFEFB;color:var(--ink)}
textarea.inp{min-height:110px;padding:10px 12px;resize:vertical}
.cnt{display:block;text-align:right;font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px;border-radius:10px;background:#F8F4EA;margin-bottom:16px}
.pair .help{grid-column:1/3;margin:0;font-size:13px;color:var(--muted)}
.when{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:20px}
.when label{display:flex;gap:8px;align-items:center;cursor:pointer}
.when input[type=radio]{width:18px;height:18px;accent-color:#0B1830}
.b1{min-height:40px;padding:0 18px;border:0;border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.b1:hover{background:#22355A}
.b1[disabled]{background:#C9CED8;cursor:not-allowed}
.b2{min-height:36px;padding:0 14px;border:1px solid #E3DCCB;border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.res{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.rr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600}
.p-ok{background:var(--okt);color:var(--ok)}
.p-warn{background:var(--g100);color:var(--g800)}
.p-bad{background:var(--badt);color:var(--bad)}
.acc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.acc:last-of-type{border-bottom:0}
.acc strong{display:block;font-weight:600}
.acc span{font-size:13px;color:var(--muted)}
.post{padding:10px 0;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post span{font-size:13px;color:var(--muted)}
.topbar{display:none}
@media (max-width: 900px){
.side{display:none}
.topbar{display:flex;flex:1 0 100%;align-items:center;justify-content:space-between;height:48px;padding:0 16px;border-bottom:1px solid var(--line)}
.main{padding:20px 16px 40px}
.work{grid-template-columns:minmax(0,1fr)}
.work>*{min-width:0}
.plats{display:flex;overflow-x:auto}
.pc{flex:0 0 150px}
.pair{grid-template-columns:1fr}
.pair .help{grid-column:auto}
}
@media (max-width: 900px){.side.open{display:flex;position:fixed;inset:48px 0 0 0;z-index:30;background:var(--ground);overflow:auto;border-right:0;padding-bottom:40px}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="app">
<div class="topbar"><strong>Post to social</strong><button type="button" class="b2" aria-expanded="{{navExpanded}}" aria-controls="admin-nav" onClick="{{toggleNav}}">{{navLabel}}</button></div>
<nav class="side {{navCls}}" id="admin-nav" aria-label="Admin">
<a class="brand" href="index.html"><i aria-hidden="true"></i><span><b>[church name]</b><span>Admin</span></span></a>
<a class="ni" href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Overview</a>
<div class="grp">Needs attention</div>
<a class="ni" href="admin-visitors.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>New visitors<em>2</em></a>
<a class="ni" href="admin-prayer.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Prayer requests<em>5</em></a>
<a class="ni" href="admin-review.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 5h14v11H9l-4 3z"></path></svg>Testimonies<em>3</em></a>
<a class="ni" href="admin-chat.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5h12v9H8l-4 3zM16 9h4v9l-3-2h-6v-2"></path></svg>Bible study chat<em>4</em></a>
<a class="ni" href="admin-registrations.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"></rect><path d="M9 9h6M9 13h6"></path></svg>Registrations</a>
<div class="grp">Every week</div>
<a class="ni" href="admin-gatherings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Gatherings &amp; Zoom</a>
<a class="ni" href="admin-live.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M10 9.5l4 2.5-4 2.5z"></path></svg>Live stream</a>
<a class="ni" href="admin-announcement.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10v4h4l6 4V6l-6 4z"></path></svg>Announcement bar</a>
<a class="ni" href="admin-reminders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg>Reminders</a>
<div class="grp">Content</div>
<a class="ni" href="admin-events.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4h16v16H4zM4 9h16"></path></svg>Events &amp; banners</a>
<a class="ni" href="admin-sermons.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2-2h12v16H7a2 2 0 0 0-2 2z"></path></svg>Sermons &amp; studies</a>
<a class="ni" href="admin-message.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"></path></svg>Today's Message</a>
<a class="ni on" href="admin-social.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3h16v-3"></path></svg>Post to social</a>
<div class="grp">Giving</div>
<a class="ni" href="admin-offerings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>Offerings</a>
<div class="grow"></div>
<a class="ni" href="admin-users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="8" r="3"></circle><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 1 0 0-6M17 20h4a5 5 0 0 0-5-5"></path></svg>Users &amp; roles</a>
<a class="ni" href="admin-settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3"></path></svg>Settings</a>
<div class="me"><b aria-hidden="true">YN</b><span><strong>[Your name]</strong>Admin</span></div>
</nav>

<main class="main">
<div class="title">
<div><h1>Post to social</h1><p>Upload once and post to the church's YouTube, Facebook and Instagram in one click, now or at a set time.</p></div>
</div>
<div class="work">
<section class="card" aria-labelledby="h-new">
<h2 id="h-new">New post</h2>
<span class="lbl">Photo or video</span>
<div class="drop"><span class="thumb" aria-hidden="true">sermon clip</span><div><strong>[sunday-clip.mp4]</strong><span>Video · 1 min 12 s · ready</span></div><button type="button" class="b2">Replace</button></div>
<div class="plats" role="group" aria-label="Post to">
<sc-for list="{{plats}}" as="p" hint-placeholder-count="3">
<button type="button" class="pc {{p.cls}}" aria-pressed="{{p.pressed}}" onClick="{{p.toggle}}"><span>{{p.state}}</span><b>{{p.name}}</b></button>
</sc-for>
</div>
<div class="field"><label class="lbl" for="cap">Caption</label><textarea id="cap" class="inp" onInput="{{onCap}}">Join us this Sunday at 10:30 am, at 6400B Frederick Road or live on our website.</textarea><span class="cnt">{{capCount}}</span></div>
<sc-if value="{{yt}}" hint-placeholder-val="{{ true }}">
<div class="pair"><div><label class="lbl" for="yt-t">YouTube title</label><input id="yt-t" class="inp" type="text" value="[Sermon title] · [Pastor's name]"></div><div><label class="lbl" for="yt-v">Visibility</label><select id="yt-v" class="inp"><option>Public</option><option>Unlisted</option><option>Private</option></select></div><p class="help">YouTube takes videos only.</p></div>
</sc-if>
<sc-if value="{{ig}}" hint-placeholder-val="{{ true }}">
<div class="pair"><div><label class="lbl" for="ig-t">Post on Instagram as</label><select id="ig-t" class="inp"><option>Reel</option><option>Feed post</option><option>Story</option></select></div><div></div><p class="help">Instagram needs a photo or a video; it does not take text-only posts. Up to 50 posts a day.</p></div>
</sc-if>
<div class="when" role="radiogroup" aria-label="When">
<label><input type="radio" name="when" checked>Post now</label>
<label><input type="radio" name="when">Schedule for</label>
<input class="inp" style="width: auto" type="datetime-local" aria-label="Date and time">
</div>
<button type="button" class="b1" onClick="{{post}}" disabled="{{noTargets}}">{{postLabel}}</button>
<sc-if value="{{posted}}" hint-placeholder-val="{{ false }}">
<div class="res" aria-live="polite">
<sc-for list="{{results}}" as="r" hint-placeholder-count="3">
<div class="rr"><span><strong>{{r.name}}</strong> · {{r.note}}</span><span class="pill {{r.pill}}">{{r.status}}</span></div>
</sc-for>
</div>
</sc-if>
</section>
<div class="rail">
<div>
<h2 class="rh">Connected accounts</h2>
<div class="card" style="padding: 6px 20px">
<div class="acc"><div><strong>YouTube</strong><span>[Channel name]</span></div><span class="pill p-ok">Connected</span></div>
<div class="acc"><div><strong>Facebook</strong><span>[Church Facebook Page]</span></div><span class="pill p-ok">Connected</span></div>
<div class="acc"><div><strong>Instagram</strong><span>[@church account]</span></div><span class="pill p-ok">Connected</span></div>
</div>
</div>
<div>
<h2 class="rh">Recent posts</h2>
<div class="card" style="padding: 6px 20px">
<div class="post"><strong>Thanksgiving Sunday, November 22</strong><span>Scheduled Nov 19, 9:00 am · Facebook, Instagram</span></div>
<div class="post"><strong>[Sermon title], full service</strong><span>Posted Oct 18 · YouTube, Facebook</span></div>
<div class="post"><strong>Prayer meeting moves to Zoom</strong><span>Posted Oct 9 · Facebook, Instagram</span></div>
</div>
</div>
</div>
</div>
</main>
</div>
</template>

    var vals = comp.renderVals();
    var out = [];
    tpl.content.childNodes.forEach(function (c) { build(c, vals, out); });
    morphChildren(app, out);
  }

  function schedule() {
    if (queued) return;
    queued = true;
    Promise.resolve().then(render);
  }

  window.PageLogic = function PageLogic(props) {
    this.props = props || {};
    this.state = {};
  };
  window.PageLogic.prototype.setState = function (p) {
    var u = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, u);
    schedule();
  };
  window.PageLogic.prototype.forceUpdate = function () { schedule(); };

  window.__boot = function (Component, props) {
    app = document.getElementById('app');
    tpl = document.getElementById('tpl');
    comp = new Component(props || {});
    ['click', 'input', 'change'].forEach(function (type) {
      app.addEventListener(type, function (e) {
        var t = e.target;
        while (t && t !== app) {
          if (t.__h && t.__h[type]) { t.__h[type](e); break; }
          t = t.parentNode;
        }
      });
    });
    render();
    if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
  };
})();
</script>
<script>
class Component extends PageLogic {
  constructor(props) {
    super(props);
    this.state = { on: { yt: true, fb: true, ig: true }, posted: false, cap: 84 };
  }
  pageVals() {
    const on = this.state.on;
    const defs = [['yt', 'YouTube', 'Upload video'], ['fb', 'Facebook', 'Post to Page'], ['ig', 'Instagram', 'Reel or post']];
    const plats = defs.map(([id, name, what]) => ({
      name, state: on[id] ? what : 'Not included', cls: on[id] ? 'on' : '', pressed: on[id] ? 'true' : 'false',
      toggle: () => this.setState({ on: { ...on, [id]: !on[id] }, posted: false })
    }));
    const chosen = defs.filter(([id]) => on[id]);
    const n = chosen.length;
    const notes = { yt: 'processing on YouTube, public in a few minutes', fb: 'live on the Page', ig: 'shared as a Reel' };
    return {
      plats,
      yt: on.yt,
      ig: on.ig,
      onCap: (e) => this.setState({ cap: e && e.target ? e.target.value.length : 0 }),
      capCount: this.state.cap + ' characters',
      noTargets: n === 0,
      postLabel: n === 0 ? 'Choose at least one account' : 'Post to ' + n + (n === 1 ? ' account' : ' accounts'),
      post: () => { if (n > 0) this.setState({ posted: true }); },
      posted: this.state.posted && n > 0,
      results: chosen.map(([id, name]) => ({ name, note: notes[id], status: 'Posted', pill: 'p-ok' }))
    };
  }
  renderVals() {
    const open = !!this.state.navOpen;
    return Object.assign({}, this.pageVals(), {
      navCls: open ? 'open' : '',
      navExpanded: open ? 'true' : 'false',
      navLabel: open ? 'Close' : 'Menu',
      toggleNav: () => this.setState({ navOpen: !this.state.navOpen })
    });
  }
}
window.__boot(Component, {});
</script>

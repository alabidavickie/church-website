.ck a{color:var(--onnavy,#F4F1EA);text-decoration:underline;text-underline-offset:3px}
.ckb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ckbtn{flex:1 1 130px;min-height:50px;padding:0 14px;white-space:nowrap;border:0;border-radius:999px 999px 0 0;font:inherit;font-weight:700;cursor:pointer;transition:background-color .16s,color .16s}
.ckbtn.yes{background:var(--gold,#E6A82A);color:var(--ink,#0B1830)}
.ckbtn.no{background:var(--onnavy,#F4F1EA);color:var(--ink,#0B1830)}
.ckbtn.yes:hover{background:#F2BE52}
.ckbtn.no:hover{background:#FFFFFF}
.cktl{background:none;border:0;padding:14px 0 0;font:inherit;font-weight:600;color:var(--onnavy,#F4F1EA);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.ckl{list-style:none;margin:0 0 18px;padding:0}
.ckl li{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;padding:14px 0;border-top:1px solid rgba(244,241,234,.16)}
.ckl strong{display:block;color:var(--onnavy,#F4F1EA)}
.ckl span{display:block;font-size:14px;color:var(--onnavy2,#B9C4D6)}
.sw{flex-shrink:0;width:52px;height:30px;margin-top:2px;border-radius:999px;border:0;background:#3A4A66;position:relative;cursor:pointer;padding:0}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#F4F1EA;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--gold,#E6A82A)}
.sw[aria-checked="true"]::after{transform:translateX(22px);background:var(--ink,#0B1830)}
.sw:disabled{opacity:.55;cursor:default}
.cklink{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}
.flast .cklink{color:var(--onnavy,#F4F1EA)}
.fc .cklink{color:var(--onnavy2,#B9C4D6);text-decoration:none}
.fc .cklink:hover{color:var(--onnavy,#F4F1EA);text-decoration:underline}
@media (max-width:600px){.ck{left:8px;bottom:8px;width:calc(100vw - 16px);padding:22px 18px 18px;border-radius:22px 22px 0 0}.ck h2{font-size:26px}}
.stk{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(250,248,243,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(11,24,48,.08),0 8px 24px rgba(11,24,48,.08);animation:stkin .22s ease-out}
@keyframes stkin{from{transform:translateY(-100%)}to{transform:none}}
.stk-in{max-width:1360px;margin:0 auto;padding:0 var(--m,16px);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px;min-height:64px}
.stk-wm{display:flex;align-items:center;gap:10px;min-height:44px;font-family:'League Spartan',Figtree,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.04em;color:var(--ink);text-decoration:none;white-space:nowrap}
.stk-wm i{width:16px;height:21px;border-radius:8px 8px 0 0;background:var(--gold);display:block;flex-shrink:0}
.stk-menu{display:flex;gap:0 22px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stk-menu::-webkit-scrollbar{display:none}
.stk-menu a{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;transition:border-color .16s}
.stk-menu a:hover,.stk-menu a[aria-current]{border-color:var(--gold)}
.stk-btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px 999px 0 0;background:var(--gold);color:var(--ink);font-weight:700;text-decoration:none;white-space:nowrap;transition:background-color .16s,color .16s}
.stk-btn:hover{background:var(--ink);color:var(--ground,#FAF8F3)}
.pg [id]{scroll-margin-top:116px}
@media (max-width:1100px){
.stk-in{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"wm btn" "menu menu";gap:0 16px;min-height:0;padding-top:6px}
.stk-wm{grid-area:wm;font-size:20px}
.stk-btn{grid-area:btn;min-height:40px;padding:0 16px;font-size:15px}
.stk-menu{grid-area:menu;margin:0 calc(-1 * var(--m,16px));padding:0 var(--m,16px);-webkit-mask:linear-gradient(90deg,#000 88%,transparent);mask:linear-gradient(90deg,#000 88%,transparent)}
.stk-menu a{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.stk{animation:none}}
@media (max-width:960px){
.flast nav a,.flast .cklink{display:inline-flex;align-items:center;min-height:44px}
.fc a,.fc .cklink{display:inline-flex;align-items:center;min-height:36px}
}
.hd-r{display:flex;align-items:center;gap:20px}
.srch{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;justify-content:center;font-weight:600;color:var(--ink);text-decoration:none}
.srch:hover span{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:3px;text-underline-offset:6px}
@media (max-width:600px){.srch span{display:none}.hd-r{gap:6px}.hd .hd-top{gap:10px}.hd .wm{font-size:clamp(18px,5.4vw,24px);gap:8px;white-space:nowrap}.hd .wm i{width:16px;height:21px}.srch{min-width:40px}.hd-r .btn.sm{padding:0 14px;font-size:15px}}
</style>
</head>

<section class="navy msg" id="message" aria-labelledby="h-msg">
<div class="wrap msg-in">
<div class="msg-tx">
<h2 id="h-msg" class="d mh">today's message</h2>
<h3 class="d mt">faith on the road</h3>
<p class="mmeta">Sunday, October 25 · [Pastor's name] · Luke 24:13–35</p>
<p class="msyn">Two friends walked away from Jerusalem with their hopes in pieces, and Jesus walked beside them before they knew who he was. He still meets us on ordinary roads, opens the Scriptures to us, and turns us back toward home.</p>
<div class="ma"><a class="btn" href="todays-message.html">Read the full message</a><a class="tl" href="todays-message.html#previous">Previous messages</a></div>
</div>
<figure class="verse">
<blockquote>Did not our heart burn within us, while he talked with us by the way, and while he opened to us the scriptures?</blockquote>
<figcaption>Luke 24:32 (KJV)</figcaption>
</figure>
</div>
</section>

<div class="wk">

<div class="it a-sun">
<span class="bul" aria-hidden="true"><svg viewBox="0 0 72 88"><rect width="72" height="88" fill="#E6A82A"></rect><path d="M20 88V50a16 16 0 0 1 32 0v38" fill="#0B1830"></path><path d="M36 34v54M20 64h32" stroke="#E6A82A" stroke-width="3"></path></svg></span>

<sc-if value="{{t.sun.hasNote}}" hint-placeholder-val="{{ true }}"><p class="tz">{{t.sun.note}}</p></sc-if>
<p class="ds">Worship, prayer and preaching at 6400B Frederick Road, and live on this website. Children are welcome, and greeters will show you around.</p>
<p class="lk"><a class="tl" href="im-new.html">Plan your visit</a><a class="tl" href="sermons.html">Past Services</a><a class="tl" href="#add-to-calendar">Add to calendar</a></p></div>
</div>

<div class="it a-bib">
<span class="bul" aria-hidden="true"><svg viewBox="0 0 72 88"><rect width="72" height="88" fill="#0B1830"></rect><path d="M12 62c9-5 16-5 24 0 8-5 15-5 24 0V36c-9-5-16-5-24 0-8-5-15-5-24 0z" fill="#E6A82A"></path><path d="M36 36v26" stroke="#0B1830" stroke-width="2.5"></path></svg></span>
<div><div class="itl"><strong>Bible Study</strong><span class="tm">{{t.bib.day}} · {{t.bib.time}}</span></div>
<sc-if value="{{t.bib.hasNote}}" hint-placeholder-val="{{ true }}"><p class="tz">{{t.bib.note}}</p></sc-if>
<p class="ds">On Zoom, from wherever you are.</p>
<div class="study">
<h4>This week's study</h4>
<p class="st">nothing can separate us</p>
<p class="sp">Romans 8:18–39</p>
<p class="sum">Paul looks honestly at suffering and still says that nothing in all creation can separate us from the love of God. We read the passage together, then talk about holding on to hope when life is hard.</p>
<h4 style="margin-bottom: 8px">Earlier in our study of Romans</h4>
<ul class="recent">
<li><a href="bible-study.html#romans-8-1">Life in the Spirit · Romans 8:1–17<span>Oct 20</span></a></li>
<li><a href="bible-study.html#romans-7">The struggle within · Romans 7:14–25<span>Oct 13</span></a></li>
<li><a href="bible-study.html#romans-6">Alive to God · Romans 6:1–14<span>Oct 6</span></a></li>
</ul>
</div>
<p class="lk"><a class="tl" href="#zoom-bible-study">Join on Zoom</a><a class="tl" href="bible-study.html">Past Bible Studies</a><a class="tl" href="reminders.html">Email me a reminder</a></p></div>
</div>

</footer>

<sc-if value="{{chatOpen}}">
<section class="tk" id="tawk" aria-label="Contact us chat">
<div class="tkh"><div><strong>[Church Name]</strong><span>We usually reply within a few minutes</span></div><button type="button" class="tkx" aria-label="Minimise chat" onClick="{{toggleChat}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<sc-if value="{{chatAllowed}}">
<div class="tkb" aria-live="polite">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="1"><p class="{{m.cls}}">{{m.text}}</p></sc-for>
</div>
<div class="tkf"><label class="sr" for="tk-in">Your message</label><textarea id="tk-in" rows="2" placeholder="Type your message" value="{{chatDraft}}" onInput="{{typeChat}}"></textarea><button type="button" class="tks" onClick="{{sendChat}}" disabled="{{cantSend}}">Send</button></div>
<p class="tkn">Preview. The live site shows the Tawk.to chat here.</p>
</sc-if>
<sc-if value="{{chatBlocked}}">
<div class="tkb">
<p class="tkm">Live chat is run by Tawk.to, which uses cookies. Allow live chat to start a conversation with the church.</p>
<button type="button" class="ckbtn yes" onClick="{{allowChat}}">Allow live chat</button>
<p class="tkm2">Or email us at [Email address], or call [Phone number].</p>
</div>
</sc-if>
</section>
</sc-if>
<sc-if value="{{showLauncher}}">
<button type="button" class="chat" aria-expanded="{{chatExpanded}}" aria-controls="tawk" onClick="{{toggleChat}}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg><span>{{chatLabel}}</span></button>
</sc-if>
<sc-if value="{{ck.open}}">
<section class="ck" role="dialog" aria-modal="false" aria-labelledby="ck-h" aria-describedby="ck-d">
<h2 id="ck-h">your privacy</h2>
<sc-if value="{{ck.simple}}">
<p id="ck-d">We use cookies to keep this site safe and working. With your permission, we would also like to use them for live chat (Tawk.to), for videos, posts and maps from YouTube, Facebook, Instagram and Google, and to count visits with Google Analytics. We never sell your data. <a href="privacy.html">Privacy policy</a></p>
<div class="ckb"><button type="button" class="ckbtn yes" onClick="{{ck.all}}">Accept all</button><button type="button" class="ckbtn no" onClick="{{ck.none}}">Reject all</button></div>
<button type="button" class="cktl" onClick="{{ck.custom}}">Choose which cookies</button>
</sc-if>
<sc-if value="{{ck.detail}}">
<p id="ck-d">Choose what you are happy with. You can change this at any time from Cookie settings at the bottom of the page. <a href="privacy.html">Privacy policy</a></p>
<ul class="ckl">
<li><div><strong>Needed for the site</strong><span>Security checks (Cloudflare Turnstile), secure giving (Stripe) and remembering this choice. Always on.</span></div><button type="button" class="sw" role="switch" aria-checked="true" aria-label="Needed for the site, always on" disabled></button></li>
<sc-for list="{{ck.rows}}" as="r" hint-placeholder-count="3"><li><div><strong>{{r.name}}</strong><span>{{r.desc}}</span></div><button type="button" class="sw" role="switch" aria-checked="{{r.on}}" aria-label="{{r.name}}" onClick="{{r.flip}}"></button></li></sc-for>
</ul>
<div class="ckb"><button type="button" class="ckbtn yes" onClick="{{ck.save}}">Save my choices</button><button type="button" class="ckbtn no" onClick="{{ck.all}}">Accept all</button></div>
</sc-if>
</section>
</sc-if>
</div>
</template>
<noscript><p style="padding:24px;font-family:system-ui,sans-serif">Please turn on JavaScript to view this page.</p></noscript>
<script>
/* Tiny page runtime: fills the page template from the page's data and keeps it up to date. */
(function () {
  var WHOLE = /^\s*\{\{\s*([^{}]+?)\s*\}\}\s*$/;
  var ANY = /\{\{\s*([^{}]+?)\s*\}\}/g;

  function lookup(scope, path) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    if (/^(['"]).*\1$/.test(path)) return path.slice(1, -1);
    var parts = path.split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }

  function fill(str, scope) {
    return str.replace(ANY, function (m, p) {
      var v = lookup(scope, p);
      return v == null ? '' : String(v);
    });
  }

  function build(node, scope, out) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      out.push(document.createTextNode(t.indexOf('{{') > -1 ? fill(t, scope) : t));
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var m = (node.getAttribute('list') || '').match(WHOLE);
      var list = (m && lookup(scope, m[1])) || [];
      var as = node.getAttribute('as') || 'item';
      list.forEach(function (item, i) {
        var s = Object.create(scope);
        s[as] = item;
        s.$index = i;
        node.childNodes.forEach(function (c) { build(c, s, out); });
      });
      return;
    }
    if (tag === 'sc-if') {
      var mv = (node.getAttribute('value') || '').match(WHOLE);
      if (mv && lookup(scope, mv[1])) node.childNodes.forEach(function (c) { build(c, scope, out); });
      return;
    }
    var el = node.cloneNode(false);
    el.__h = {};
    Array.prototype.slice.call(el.attributes).forEach(function (a) {
      var name = a.name;
      var val = a.value;
      if (name.indexOf('hint-') === 0) { el.removeAttribute(name); return; }
      if (val.indexOf('{{') === -1) return;
      var w = val.match(WHOLE);
      if (w) {
        var v = lookup(scope, w[1]);
        if (name.indexOf('on') === 0) {
          el.removeAttribute(name);
          if (typeof v === 'function') el.__h[name.slice(2)] = v;
          return;
        }
        if (v === false || v == null) el.removeAttribute(name);
        else if (v === true) el.setAttribute(name, '');
        else el.setAttribute(name, String(v));
      } else {
        el.setAttribute(name, fill(val, scope));
      }
    });
    if (el.localName === 'textarea' && el.hasAttribute('value')) el.value = el.getAttribute('value');
    var kids = [];
    node.childNodes.forEach(function (c) { build(c, scope, kids); });
    kids.forEach(function (k) { el.appendChild(k); });
    if (el.localName === 'select' && el.hasAttribute('value')) el.value = el.getAttribute('value');
    out.push(el);
  }

  function firstClass(el) {
    return ((el.getAttribute && el.getAttribute('class')) || '').split(' ')[0];
  }

  function same(a, b) {
    if (a.nodeType !== b.nodeType) return false;
    if (a.nodeType !== 1) return true;
    return a.localName === b.localName && a.namespaceURI === b.namespaceURI && firstClass(a) === firstClass(b) && (a.id || '') === (b.id || '');
  }

  // Matches old and new children so that a block appearing or disappearing
  // does not rebuild everything after it (which would lose focus and typing).
  function morphChildren(oldP, list) {
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      var o = oldP.childNodes[i];
      if (!o) { oldP.appendChild(n); continue; }
      if (!same(o, n)) {
        var j, ahead = -1, behind = -1;
        for (j = i + 1; j < Math.min(list.length, i + 10); j++) { if (same(o, list[j])) { ahead = j; break; } }
        if (ahead > -1 && o.nodeType === 1) { oldP.insertBefore(n, o); continue; }
        for (j = i + 1; j < Math.min(oldP.childNodes.length, i + 10); j++) { if (same(oldP.childNodes[j], n)) { behind = j; break; } }
        if (behind > -1 && n.nodeType === 1) {
          for (var k = i; k < behind; k++) oldP.removeChild(oldP.childNodes[i]);
          o = oldP.childNodes[i];
        } else if (ahead > -1) {
          oldP.insertBefore(n, o);
          continue;
        } else {
          oldP.replaceChild(n, o);
          continue;
        }
      }
      if (o.nodeType === 3) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; continue; }
      morphEl(o, n);
    }
    while (oldP.childNodes.length > list.length) oldP.removeChild(oldP.lastChild);
  }

  function morphEl(o, n) {
    Array.prototype.slice.call(o.attributes).forEach(function (a) {
      if (!n.hasAttribute(a.name)) o.removeAttribute(a.name);
    });
    Array.prototype.slice.call(n.attributes).forEach(function (a) {
      if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value);
    });
    o.__h = n.__h;
    if ((o.localName === 'input' || o.localName === 'textarea' || o.localName === 'select') && n.hasAttribute('value') && o !== document.activeElement && o.value !== n.getAttribute('value')) {
      o.value = n.getAttribute('value');
    }
    if (o.localName === 'textarea' || o.localName === 'input' || o.localName === 'select') return;
    morphChildren(o, Array.prototype.slice.call(n.childNodes));
  }

  var app, tpl, comp, queued = false;

  function render() {
    queued = false;
    var vals = comp.renderVals();
    var out = [];
    tpl.content.childNodes.forEach(function (c) { build(c, vals, out); });
    morphChildren(app, out);
  }

  function schedule() {
    if (queued) return;
    queued = true;
    Promise.resolve().then(render);
  }

  window.PageLogic = function PageLogic(props) {
    this.props = props || {};
    this.state = {};
  };
  window.PageLogic.prototype.setState = function (p) {
    var u = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, u);
    schedule();
  };
  window.PageLogic.prototype.forceUpdate = function () { schedule(); };

  window.__boot = function (Component, props) {
    app = document.getElementById('app');
    tpl = document.getElementById('tpl');
    comp = new Component(props || {});
    ['click', 'input', 'change'].forEach(function (type) {
      app.addEventListener(type, function (e) {
        var t = e.target;
        while (t && t !== app) {
          if (t.__h && t.__h[type]) { t.__h[type](e); break; }
          t = t.parentNode;
        }
      });
    });
    render();
    if (typeof comp.componentDidMount === 'function') comp.componentDidMount();
  };
})();

<script>
class Component extends PageLogic {
  constructor(props) {
    super(props);
    this.state = { notice: true, ev: 0, sent: false };
  }
  visitorTz() {
    const map = { 'Lagos': 'Africa/Lagos', 'New York': 'America/New_York', 'London': 'Europe/London', 'Los Angeles': 'America/Los_Angeles' };
    const pick = this.props.visitor || 'auto';
    if (map[pick]) return map[pick];
    try {
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      new Intl.DateTimeFormat('en-US', { timeZone: tz }).format(new Date());
      return tz || 'America/New_York';
    } catch (e) {
      return 'America/New_York';
    }
  }
  cityOf(tz) {
    if (tz === 'America/New_York') return 'New York';
    const last = String(tz).split('/').pop() || 'New York';
    return last.replace(/_/g, ' ');
  }
  partsIn(date, tz) {
    const o = {};
    new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(date).forEach((p) => { o[p.type] = p.value; });
    return o;
  }
  nextNY(weekday, hh, mm) {
    const tz = 'America/New_York';
    const p = this.partsIn(new Date(), tz);
    const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday);
    let add = (weekday - wd + 7) % 7;
    if (add === 0 && (Number(p.hour) % 24) * 60 + Number(p.minute) > hh * 60 + mm + 90) add = 7;
    const base = Date.UTC(Number(p.year), Number(p.month) - 1, Number(p.day) + add, hh, mm);
    const off = (t) => { const q = this.partsIn(new Date(t), tz); return Date.UTC(Number(q.year), Number(q.month) - 1, Number(q.day), Number(q.hour) % 24, Number(q.minute)) - t; };
    let t = base - off(base);
    t = base - off(t);
    return new Date(t);
  }
  clock(date, tz) {
    const o = {};
    new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', hour: 'numeric', minute: '2-digit' }).formatToParts(date).forEach((p) => { o[p.type] = p.value; });
    return { day: o.weekday, time: ((o.hour || '') + ':' + (o.minute || '') + ' ' + (o.dayPeriod || '')).trim().toLowerCase() };
  }
  slot(weekday, hh, mm) {
    const fallbackDay = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][weekday];
    try {
      const tz = this.visitorTz();
      const city = this.cityOf(tz);
      const d = this.nextNY(weekday, hh, mm);
      const here = this.clock(d, tz);
      const ny = this.clock(d, 'America/New_York');
      const same = here.day === ny.day && here.time === ny.time;
      return {
        day: here.day,
        time: here.time + ' ' + city,
        hasNote: !same,
        note: same ? '' : ny.day + ' ' + ny.time + ' in New York',
        both: same ? here.day + ' ' + here.time + ' ' + city : here.day + ' ' + here.time + ' ' + city + ' · ' + ny.time + ' New York'
      };
    } catch (e) {
      const h12 = ((hh + 11) % 12) + 1;
      const time = h12 + ':' + String(mm).padStart(2, '0') + (hh < 12 ? ' am' : ' pm');
      return { day: fallbackDay, time: time + ' New York', hasNote: false, note: '', both: fallbackDay + ' ' + time + ' New York' };
    }
  }
  pageVals(consent) {
    const tz = this.visitorTz();
    const data = [
      { short: 'thanksgiving sunday', title: 'Thanksgiving Sunday Service', when: 'Sunday, November 22 · 10:30 am New York', place: '6400B Frederick Road, and live online', posterDate: 'nov 22', posterTitle: 'thanksgiving sunday', bg: '#E6A82A', fg: '#0B1830' },
      { short: 'christmas carols', title: 'Christmas Carol Service', when: 'Sunday, December 20 · [time]', place: '6400B Frederick Road', posterDate: 'dec 20', posterTitle: 'christmas carol service', bg: '#0B1830', fg: '#E6A82A' },
      { short: 'watch night', title: 'Watch Night Service', when: 'Thursday, December 31 · [time]', place: '6400B Frederick Road, and live online', posterDate: 'dec 31', posterTitle: 'watch night service', bg: '#2B4470', fg: '#F4F1EA' }
    ];
    const ev = this.state.ev % data.length;
    const msgs = this.state.msgs || [{ cls: 'them', text: 'Hello, and welcome. How can we help today? Ask about a visit, prayer, giving or anything else.' }];
    const events = data.map((d, i) => ({
      ...d,
      active: i === ev,
      cls: i === ev ? 'on' : '',
      pressed: i === ev ? 'true' : 'false',
      alt: d.title + ', ' + d.when,
      posterStyle: 'background: ' + d.bg + '; color: ' + d.fg,
      pick: () => this.setState({ ev: i })
    }));
    const arches = [
      ['62%', '#E6A82A'], ['84%', '#16294A'], ['100%', '#EFEADF'], ['74%', '#2B4470'], ['92%', '#E6A82A'],
      ['68%', '#EFEADF'], ['100%', '#16294A'], ['80%', '#E6A82A'], ['58%', '#2B4470']
    ].map(([h, c]) => ({ style: 'height: ' + h + '; background: ' + c }));
    return {
      live: this.props.live ?? false,
      showNotice: (this.props.announcement ?? true) && this.state.notice,
      dismiss: () => this.setState({ notice: false }),
      timesLabel: 'Times shown in ' + this.cityOf(tz) + ' time',
      t: {
        sun: this.slot(0, 10, 30),
        bib: this.slot(2, 18, 0),
        pra: this.slot(5, 19, 0)
      },
      events,
      notSent: !this.state.sent,
      sent: this.state.sent,
      send: () => this.setState({ sent: true }),
      again: () => this.setState({ sent: false }),
      arches,
      showLauncher: !consent.ck.open,
      chatOpen: !!this.state.chatOpen && !consent.ck.open,
      chatExpanded: this.state.chatOpen ? 'true' : 'false',
      chatLabel: this.state.chatOpen ? 'Close' : 'Contact us',
      toggleChat: () => this.setState({ chatOpen: !this.state.chatOpen }),
      openChat: () => this.setState({ chatOpen: true }),
      chatBlocked: !consent.chatAllowed,
      msgs,
      chatDraft: this.state.chatDraft || '',
      cantSend: !(this.state.chatDraft || '').trim(),
      typeChat: (e) => this.setState({ chatDraft: e.target.value }),
      sendChat: () => {
        const t = (this.state.chatDraft || '').trim();
        if (!t) return;
        const next = msgs.concat([{ cls: 'me', text: t }]);
        if (!msgs.some((m) => m.cls === 'me')) next.push({ cls: 'them', text: 'Thank you. Someone from the church will answer here shortly. If we are away, leave your email and we will write back.' });
        this.setState({ chatDraft: '', msgs: next });
      },
      allowChat: () => this.ckSet(Object.assign({}, this._ckSaved || {}, { chat: true }))
    };
  }
  ckRead() {
    try {
      const v = JSON.parse(window.localStorage.getItem('church-consent-v1') || 'null');
      if (v && typeof v === 'object') return v;
    } catch (e) {}
    return null;
  }
  ckSet(v) {
    const rec = { chat: !!v.chat, media: !!v.media, analytics: !!v.analytics, at: new Date().toISOString() };
    try { window.localStorage.setItem('church-consent-v1', JSON.stringify(rec)); } catch (e) {}
    try {
      if (typeof window.gtag === 'function') {
        window.gtag('consent', 'update', { analytics_storage: rec.analytics ? 'granted' : 'denied', ad_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied' });
      }
    } catch (e) {}
    this._ckSaved = rec;
    this.setState({ ckOpen: false, ckView: 'simple', ckDraft: null });
  }
  consentVals() {
    if (!this._ckLoaded) { this._ckLoaded = true; this._ckSaved = this.ckRead(); }
    const saved = this._ckSaved;
    const open = !saved || !!this.state.ckOpen;
    const view = this.state.ckView || 'simple';
    const draft = this.state.ckDraft || saved || { chat: false, media: false, analytics: false };
    const defs = [
      ['chat', 'Live chat', 'Tawk.to, for the Contact us chat.'],
      ['media', 'Videos, posts and maps', 'The YouTube live stream and sermons, Facebook and Instagram posts, and Google Maps.'],
      ['analytics', 'Visit counts', 'Google Analytics, so we can see which pages help people. No advertising.']
    ];
    const rows = defs.map(([k, name, desc]) => ({
      name, desc,
      on: draft[k] ? 'true' : 'false',
      flip: () => this.setState({ ckDraft: Object.assign({}, draft, { [k]: !draft[k] }) })
    }));
    return {
      ck: {
        open, rows,
        simple: view === 'simple',
        detail: view === 'detail',
        all: () => this.ckSet({ chat: true, media: true, analytics: true }),
        none: () => this.ckSet({ chat: false, media: false, analytics: false }),
        custom: () => this.setState({ ckView: 'detail', ckDraft: draft }),
        save: () => this.ckSet(draft)
      },
      chatAllowed: !!(saved && saved.chat),
      openCookies: () => this.setState({ ckOpen: true, ckView: 'detail', ckDraft: null })
    };
  }
  stickyVals() {
    if (!this._stkInit && typeof window !== 'undefined') {
      this._stkInit = true;
      const check = () => {
        const hd = document.querySelector('header.hd');
        if (!hd) return;
        const s = hd.getBoundingClientRect().bottom < 0;
        if (s !== !!this._stk) { this._stk = s; this.setState({ stkTick: Date.now() }); }
      };
      window.addEventListener('scroll', check, { passive: true });
      window.addEventListener('resize', check);
      setTimeout(check, 0);
    }
    return { stk: { show: !!this._stk } };
  }
  renderVals() {
    const c = this.consentVals();
    return Object.assign({}, this.pageVals(c), c, this.stickyVals());
  }
}
window.__boot(Component, {"live":false,"announcement":true,"visitor":"auto"});
</script>
